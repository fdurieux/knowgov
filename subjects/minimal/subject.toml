# The smallest subject: no artefacts, no record, one task with two required keys. The harness
# loads it, the rules find nothing, and the gate reports every key absent and BLOCKED. It is
# the worked example of subjects/README.md and the fixture the CI stack job runs.
[subject]
id = "minimal"
name = "Minimal"
listed = false   # a fixture: the page's subject drop-down skips it when it scans subjects/; named directly it still loads
description = "An empty subject: nothing to read, so every required key is absent."

[tasks.codegen]
keys = ["thing|property", "other|property"]
block_levels = ["absent", "declared_gap", "disputed", "invalidated"]
max_unverified_share = 0.25

# no record to replay; the date its runs read review currency on is pinned all the same (task-0075),
# so a run on it never reads the wall clock (decision-0005)
[record]
as_of = 2026-11-04
