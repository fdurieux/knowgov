# The J-F data-load subject: pumllint's recreation experiment (docs/recreate-experiment.md there),
# J-F's daily asset load reverse-engineered into a specification kit and rebuilt from it. This
# manifest names what the harness loads and the page shows; the bytes are vendored from pumllint
# under vendor/ (tools/vendor_subject.py --subject jef_data_load). Format: subjects/README.md.
# J-F's original code is private and is never vendored: the reference code is the public rebuild
# of 2026-10-24 (the codex arm), 258/258 on the kit's suite.

[subject]
id = "jef_data_load"
name = "J-F data load"
description = "J-F's daily asset load as a specification kit: 163 EARS requirements, prose contracts, DMN decision tables, PlantUML diagrams and a tagged Gherkin suite, reverse-engineered from the code and rebuilt from the kit alone (pumllint, recreate_experiment). The maintainer's own program; synthetic fixtures; no bank data."
record_model = ""

# The artefacts: one per layer of the kit, as the degradation test's pre-registration orders them
# (L2 requirements, L3 contracts, L4 decision tables, L5 diagrams, L1 the suite). A layer that is a
# folder is one directory artefact (subjects/README.md): its files are the parts of one document,
# so a statement the layer makes about a requirement is one assertion, and the layers join on the
# requirement id (harness/extract.py, the bundle mappers). Keys are the kit's own paths.
[[artefact]]
key = "requirements.json"
short = "req"
family = "requirements"
format = "json"
label = "requirements"
format_label = "JSON, EARS statements"
path = "vendor/recreate_experiment/kit/requirements.json"
mapper = "requirements_json"

[[artefact]]
key = "contracts/"
short = "con"
family = "contracts"
format = "markdown"
label = "contracts"
format_label = "markdown, with the packaged TOML and the JSON Schemas"
path = "vendor/recreate_experiment/kit/contracts"
include = ["*.md", "*.toml", "*.json"]
mapper = "contracts_markdown"

[[artefact]]
key = "contracts/dmn/"
short = "dmn"
family = "decision_tables"
format = "dmn-1.3"
label = "decision tables"
format_label = "DMN 1.3"
path = "vendor/recreate_experiment/kit/contracts/dmn"
include = ["*.dmn"]
mapper = "dmn_decisions"

[[artefact]]
key = "uml/"
short = "uml"
family = "diagrams"
format = "plantuml"
label = "diagrams"
format_label = "PlantUML"
path = "vendor/recreate_experiment/kit/uml"
include = ["*.puml"]
mapper = "plantuml_realises"

[[artefact]]
key = "features/"
short = "fea"
family = "acceptance"
format = "gherkin"
label = "acceptance suite"
format_label = "Gherkin, tagged with requirement ids"
path = "vendor/recreate_experiment/kit/features"
include = ["*.feature"]
mapper = "gherkin_tagged"

# The code the kit's suite verified: the public rebuild of 2026-10-24 (258/258), standing in for
# J-F's private original; its digest is the execution evidence.
[reference]
code = "vendor/recreate_experiment/rebuilds/codex-2026-10-24/src/jef/data"

# The oracle: the kit's own pytest-bdd suite through its seams (oracle/jef_suite.py), one scenario
# per feature file; a result is the feature's cases passed over its total. The reference (the codex
# rebuild) passes 258 of 258 on CPython 3.12, the interpreter the kit's pins name; CPython 3.13
# wraps seven --help usage lines differently and fails those seven verbatim cases.
[oracle]
script = "oracle/jef_suite.py"
suite_order = ["actions", "adjustment", "chain", "cli", "collectors", "decisions", "differential", "seam", "status", "store", "sync", "universe"]

[provenance]
harness_name = "knowgov harness"
human = { id = "agent:maintainer", name = "maintainer (the kit's owner; precedence rule and revisions, 2026-10-24)" }
llm = { id = "agent:llm", name = "the reverse engineer (a fresh agent, 2026-10-23)" }
inference_at = "2026-10-23T00:00:00+00:00"
inference_tool = "reverse engineer"

# Execution verification derived from the kit's own links: every scenario tagged @JDL-nnn
# verifies that requirement's statement, so a scenario the plant removes verifies nothing.
# Authored links (the citations, the tags, the footers, the rule descriptions, the tables'
# structure) are reviewed by construction, as the kit's revision record says.
[verification]
derive_execution = { from_predicate = "verified_by", key_predicate = "statement", separator = "; " }
execution_scope = "suite scenario {scenario} on the codex rebuild (kit suite 2026-10-24, 258/258)"
review = { at = "2026-10-24", scope = "the fourth rebuild's review of the kit (INPUT-QUALITY.md, ten findings, all corrected)" }
authored = { at = "2026-10-23", scope = "authored by the reverse engineer from the code alone, revised 2026-10-24 (CHANGES.md)" }
approval = { at = "2026-10-24", record = "kit CHANGES.md revision 2026-10-24: the precedence rule and the manifest" }

# The task is the kit's own: rebuild the program so that every stored number, verdict and exit
# code matches. Every requirement is required. The documents named verbatim are the ones the task
# prompt asks for byte for byte and the bundle's assertions cannot stand in for: the packaged
# configuration files the program embeds, the parser surface and help texts the suite checks
# verbatim, and the adapter interface; the governed arm asked for exactly these and abstained
# without them (task-0022.01, 2026-11-02).
[tasks.codegen]
verbatim = ["contracts/universe.toml", "contracts/classifications.toml", "contracts/cli.md", "contracts/cli_help.md", "contracts/HARNESS_INTERFACE.md"]
