# The rules' subject constants: the vague wording R-VAGUE looks for in a requirement's row (none
# in the pristine kit; the degradation test's A defects write "usable" and loosen exact values).
[rules]
requirement_id_pattern = "JDL-\\d{3}"
vague_words = ["usable", "approximately", "roughly", " around ", " about ", "more or less", "reasonable", "appropriate", "as needed"]

[three_valued]
keys = []

[record]
dir = "record"
# the date the record is read as of (decision-0005): the kit's review and suite run, 2026-10-24. A
# deterministic run and the comparator read review currency on it, so the record never moves by the
# clock; the gate command reads today.
as_of = 2026-10-24

# The register view: the derived key-to-node map, the evidence anchor the register's links use for a
# requirement (the jef_kit source system, decision 0005 there), and its export folder's manifest.
[register]
map = "register_map.toml"
requirement_anchor = "jef_kit:requirements.json#"
export_manifest = "exports/jef_kit/2026-11-01/MANIFEST.toml"

# the page's heading; the no-governance reference it cites is the degradation test, which ran on this very kit
[page]
title = "J-F's data load as a governed kit — the degradation test, read by the gate"
subtitle = "Six scenarios, a gate, the kit's own suite as the oracle. The record ran no arm: an Arms run calls the model the page chooses. Record: pumllint <code>docs/recreate-experiment.md</code> and <code>recreate_experiment/degradation-2026-10-28</code>, graded 2026-10-29."
oracle = []

[page.reference]
title = "Without governance — the degradation test (recreate_experiment/degradation-2026-10-28, graded 2026-10-29)"
text = "Six of the fifteen planted defects reached the code, all six concealed by the arm's own suite and caught by the pristine one; every outcome the one the kit's precedence rule gives."
numbers = { planted = 15, reached_code = 6, concealed_by_own_suite = 6, caught_by_pristine_suite = 6 }

# What tools/vendor_subject.py copies from a pumllint checkout into vendor/, and the words of the
# SOURCE.md it writes there; tests/test_vendor_subject.py holds the copy to the note. The hidden
# inputs, the mutant trees, the arms' rebuilds other than the reference and the graded results
# stay in pumllint.
[vendor]
source = "fdurieux/pumllint"
title = "Vendored copy of the J-F data-load subject, from pumllint's recreation experiment"
paths = [
  "docs/recreate-experiment.md",
  "recreate_experiment/PREREGISTRATION.md",
  "recreate_experiment/kit",
  "recreate_experiment/rebuilds/codex-2026-10-24/README.md",
  "recreate_experiment/rebuilds/codex-2026-10-24/ASSUMPTIONS.md",
  "recreate_experiment/rebuilds/codex-2026-10-24/jdl_adapter.py",
  "recreate_experiment/rebuilds/codex-2026-10-24/src",
  "recreate_experiment/rebuilds/codex-2026-10-24/deploy",
  "recreate_experiment/degradation-2026-10-28/PREREGISTRATION.md",
  "recreate_experiment/degradation-2026-10-28/README.md",
  "recreate_experiment/degradation-2026-10-28/plant/README.md",
  "recreate_experiment/degradation-2026-10-28/plant/plant.md",
  "recreate_experiment/degradation-2026-10-28/plant/walk.md",
  "recreate_experiment/degradation-2026-10-28/plant/patches",
  "recreate_experiment/degradation-2026-10-28/plant/gates",
]
what = "the record (`docs/recreate-experiment.md`, the pre-registration), the kit (`recreate_experiment/kit`: requirements, contracts, DMN, diagrams, the tagged Gherkin suite with its fixtures), the reference code (the codex rebuild of 2026-10-24, `src/jef`, `deploy/daily.sh` and its harness adapter), and the degradation test's pre-registration with its plant patches and gate readouts; nothing else, and never J-F's own code"
note = """
pumllint's relative layout is kept under this directory so the kit's own path logic
(`features/`, `contracts/`, `MANIFEST.sha256`) and the record's paths stay valid. The
documents under `recreate_experiment/kit` are the subject the harness loads and the arms
read; the rebuild under `recreate_experiment/rebuilds/codex-2026-10-24` stands in for
J-F's private original as the code the kit's suite verified (258/258); the patches under
`recreate_experiment/degradation-2026-10-28/plant/patches` are the plants of the
subject's scenarios. Nothing here is written by a run: the platform's runs land under
`runs/`. This table is the record of which bytes the platform carries. To refresh it,
check pumllint out at the tag you want and run
`python tools/vendor_subject.py <checkout> --subject jef_data_load`, which rewrites this
file; `tests/test_vendor_subject.py` holds every file to its digest.
"""
