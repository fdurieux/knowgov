# The demo's reading of the gate's 163 keys onto the IEAM register: which register nodes each
# key concerns. Derived on 2026-11-01 from the kit's own citations: a requirement's row names the
# nodes of the contracts and decision tables that cite it (one table per document, in this file's
# header comment of its generator run), a requirement no contract cites is placed by its kind.
# The anchor is the first citing document, the same path the register's link evidence uses with
# the jef_kit: prefix. Drafted, not yet approved: the page says so until the maintainer reads the
# rows and sets status = "approved" with the date. Nothing here is written back to the register.
#
# Second rule, reconciled 2026-11-01 against the register at v0.2.0: a row also names both
# endpoints of every register link whose evidence cites the key (28 keys, 29 rows changed), so
# the nodes a key below approved lights are never fewer than the nodes the register's own links
# put the requirement on; tests/test_jef_subject.py holds every row to that. A row that was
# placed by kind on the application alone and is cited by a link takes the link's endpoints
# instead (JDL-089, JDL-090, JDL-107). The by-kind rows no link cites are placed on the run
# they belong to: sync rituals on the sync module and the sync run (JDL-092, JDL-097, JDL-098,
# JDL-102), status rituals and the status arithmetic on the health module and the status run
# (JDL-108, JDL-115, JDL-119, JDL-128). The 14 cli keys no contract cites stay on the application,
# which is the command.
#
# Chain rows, 2026-11-01: JDL-155 and JDL-156 name their stage's step, run and module by the
# stage name the contract gives them. JDL-146, 147, 149, 151 and 153 are the preamble, the exec
# override and the traps, which govern the run and no one step, so they stay on the journey.
# JDL-154, 157 and 158 (restore, binning, upload) were placed on the steps decision 0006 added at
# ieam-register v0.2.1 (Restore the store, Bin the assets, Upload the run, and the product Daily run
# outputs); the deprecated step Publish the seam frame left every row. The maintainer approved the
# map on 2026-11-01 at v0.2.0 (knowgov #23); these rows, revised for v0.2.1, await the line again.
#
# contracts/universe.toml.md, classifications.toml.md, the packaged TOML -> ENT-0007 (and APP-0005)
# contracts/collectors.md, fixtures.md -> APP-0009, PROC-0009
# contracts/adjustment.md -> APP-0008, ENT-0009, ENT-0008; contracts/store.md -> APP-0008, ENT-0008
# contracts/seam_frame.md -> ENT-0010, PRD-0004, APP-0005; contracts/leg.md -> PROC-0009, APP-0006
# contracts/cli.md, cli_help.md, refusals.md -> APP-0005; contracts/chain.md -> PROC-0006, APP-0005, JRN-0005
# the status schema and example -> APP-0007, PROC-0008; the sync summary schema and example -> APP-0006, PROC-0007
# dmn: actions_gate -> ENT-0009, APP-0006; basis -> APP-0008; command_store_state -> APP-0005, ENT-0008;
#      refusal_routing -> APP-0005; status_verdicts -> APP-0007, PROC-0008; sync_window -> APP-0006, PROC-0009
# by kind: chain -> PROC-0006; verdict -> APP-0007, PROC-0008; cli, refusal -> APP-0005; else APP-0005

