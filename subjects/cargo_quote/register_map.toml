# The demo's reading of the gate's 57 keys (codegen's 36, and since decision-0044 design's 21
# others) onto the IEAM register: which register nodes each key concerns. Hand-authored, like
# views.SYSTEMIC is the demo's reading of the record's §6; the register itself carries no such
# map, and the kit files are the evidence each row rests on.
# A row names the register nodes a change to the key would touch, the kit anchor (the same
# path#section the register's own source pointers and link evidence use), and a short note.
# Nothing here is written back to the register; the box the page draws from it says "the
# demo's reading" and its approval below is the maintainer's, not the register's.
#
# owner (task-0043, added 2026-11-03, after the approval below): the one unit that answers for the
# key, so a scenario yields one questionnaire per unit and no key is asked twice. It is always one of
# the owners the vendored register gives the row's nodes (a test holds it so): the product owner
# (ORG-0001) for the decision tables' rules and the flow, architecture stewardship (ORG-0002) for
# the API's behaviour and its response. Who may rule on a key stays every unit owning its nodes
# (decision-0002); who closes OD-1 stays the unit its declaration names (compliance, ORG-0004).

[map]
basis = "authored"
author = "the demo session, drafted 2026-10-30"
status = "approved"         # the maintainer read the rows as drafted and approved them, 2026-10-31; the design class's 21 rows approved 2026-11-15 by decision-0044 ("3. Yes, as proposed"); the page says so
approved_by = "fdurieux"
approved_on = 2026-11-15
register_commit = "ef7fe0e114128ce0d76694fb2f95e0373ab18d2e"
keys_expected = 57

