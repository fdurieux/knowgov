# The CargoQuote subject: what the harness loads and the page shows. Paths are relative to this
# directory. Written from the harness and the page as they stood at the move (decision-0001).
# The format is documented in subjects/README.md.

[subject]
id = "cargo_quote"
name = "CargoQuote"
description = "A fictional freight quoting service: the kit of pumllint's governed-knowledge experiment, synthetic content, no bank data."
record_model = "gpt-5.1-2025-11-13"

