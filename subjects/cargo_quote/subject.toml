[oracle]
script = "vendor/stack_experiment/smoke_test.py"
status_scenario = "screening_down_hold"   # the suite scenario whose detail carries the status the code returned
suite_order = [
  "quoted_low_risk",
  "accept_boundary_41",
  "review_boundary_42",
  "refuse_boundary_67",
  "refuse_high_risk",
  "price_exact_heavy",
  "price_exact_both",
  "invalid_weight_low",
  "invalid_value_over",
  "screening_down_hold",
  "store_down_error",
]

[provenance]
harness_name = "kg_experiment harness"
human = { id = "agent:maintainer", name = "maintainer (authoring 2026-10-30; review record 2026-08-06)" }
llm = { id = "agent:llm", name = "architecture assistant (2026-10-27)" }
