# The design pass (doc-0014 C3, task-0101): what one session writing the specification from the intent
# reads before it commits, the keys a requirements-and-design pass rests on. codegen above stays frozen;
# this class is the platform's, recorded nowhere in the record, and the comparator never reads it.
[tasks.design]
rationale = """
A design pass turns the requirements into decisions and structure: what each requirement says
and which component carries it, where the screening bands fall and what each band does, what the
service does when a dependency fails, the order of the flow, the statuses the interface answers
with, and which containers call which. It rests on those keys and not on the build detail the
codegen class adds (field bounds, pricing arithmetic, field presence in a response), which the
design leaves to the build. The test-side trace (a requirement's verified_by) belongs to the test
stage. The structure is extracted from the C4 diagram and never verified, so a clean kit reads
QUALIFIED here: the design may proceed on it, named as unverified, as long as it stays under the
bar. A requirement a document leaves open, a contradiction, a missing statement or one a change
ended blocks, as for codegen: a design written over them would decide what its owner has not.
"""
keys = [
  "REQ-01|text",
  "REQ-02|text",
  "REQ-03|text",
  "REQ-04|text",
  "REQ-05|text",
  "REQ-06|text",
  "REQ-07|text",
  "REQ-08|text",
  "REQ-01|implemented_by",
  "REQ-02|implemented_by",
  "REQ-03|implemented_by",
  "REQ-04|implemented_by",
  "REQ-05|implemented_by",
  "REQ-06|implemented_by",
  "REQ-07|implemented_by",
  "REQ-08|implemented_by",
  "S-accept|max",
  "S-review|min",
  "S-review|max",
  "S-refuse|min",
  "S-accept|status",
  "S-review|status",
  "S-refuse|status",
  "S-accept|notified",
  "S-review|notified",
  "S-refuse|notified",
  "QuoteAPI|on_store_failure",
  "QuoteAPI|on_notification_failure",
  "QuoteAPI|on_screening_outage",
  "flow|order",
  "response|statuses",
  "shipper|uses:quote_api",
  "quote_api|uses:screening_service",
  "quote_api|uses:tariff_engine",
  "quote_api|uses:quote_store",
  "quote_api|uses:notification_service",
]
block_levels = ["absent", "declared_gap", "disputed", "invalidated"]
max_unverified_share = 0.25

# D5: the three-valued answer, measured on the scenario that asks for it
[three_valued]
keys = ["S-review|notified", "S-refuse|notified", "QuoteAPI|notified_after_screening"]

[record]
dir = "vendor/kg_experiment/results"
# the date the record is read as of (decision-0005): its smoke run and authoring, 2026-10-30. A
# deterministic run and the comparator read review currency on it, so the record never moves by the
# clock; the gate command reads today. The review-only keys, reviewed 2026-08-06, lapse on 2027-08-07.
as_of = 2026-10-30

# the page's heading, and sentences it adds to every scenario's oracle panel (the record's S6 asks for the new prices)
[page]
title = "Neo4j as a governed knowledge repository — the proof of concept, replayed"
subtitle = "Seven scenarios, a gate, two generator arms, one oracle. Record: <code>docs/neo4j-governed-knowledge-evaluation.md</code> §6, PRs #214–#218."
oracle = ["S6 asks for the new prices."]

# the no-governance reference the page cites
[page.reference]
title = "Without governance — the degradation test (recreate_experiment/degradation-2026-10-28, graded 2026-10-29)"
text = "Six of the fifteen planted defects reached the code, all six concealed by the arm's own suite and caught by the pristine one; every outcome the one the kit's precedence rule gives."
numbers = { planted = 15, reached_code = 6, concealed_by_own_suite = 6, caught_by_pristine_suite = 6 }

# The rules' subject constants (pre-registration §4): the vague-wording list, which key a declared-open
# requirement governs, and the declared gap R-REQ raises for a requirement whose text says NOT YET SPECIFIED.
[rules]
vague_words = ["around", "roughly", "approximately", "low forties", "mid-sixties", "clearly", "as soon as", "usable", "appropriate", "anything higher"]
declared_gap_id = "gap:declared:OD-1"
declared_gap_text = "{req} is NOT YET SPECIFIED (open decision OD-1, owner: compliance)"

[rules.requirement_keys]
"REQ-06" = "QuoteAPI|on_screening_outage"

# The register view: the approved key-to-node map, the evidence anchor the register's links use for a
# requirement, the export folder's manifest in the vendored register, and the artefact the stage-2
# change touches (the links citing it light up in the footprint).
[register]
map = "register_map.toml"
requirement_anchor = "kit:requirements.md#"
export_manifest = "exports/kit/2026-10-30/MANIFEST.toml"

# What tools/vendor_subject.py copies from a pumllint checkout into vendor/, and the words of the
# SOURCE.md it writes there; tests/test_vendor_subject.py holds the copy to the note.
[vendor]
source = "fdurieux/pumllint"
title = "Vendored copy of the CargoQuote subject and the proof-of-concept record, from pumllint"
paths = [
  "kg_experiment/kit",
  "kg_experiment/results",
  "kg_experiment/PREREGISTRATION.md",
  "stack_experiment/cargo_quote",
  "stack_experiment/smoke_test.py",
  "tools/acceptance/__init__.py",
  "tools/acceptance/cargo_quote_suite.py",
  "tools/acceptance/runner_child.py",
  "tools/acceptance/suites.py",
]
what = "the kit (`kg_experiment/kit`), the CargoQuote documents and reference implementation (`stack_experiment/cargo_quote`), the acceptance oracle (`stack_experiment/smoke_test.py`, `tools/acceptance`), the record (`kg_experiment/results`) and the pre-registration; nothing else"
note = """
pumllint's relative layout is kept under this directory so the oracle's own path
logic and the record's `SHA256SUMS` paths stay valid. The record under
`kg_experiment/results` is pumllint's and is never written here: the platform's
re-runs land under `runs/`. The documents are the subject the harness loads and
the arms read; the oracle grades what the arms wrote. This table is the record of
which bytes the platform carries. To refresh it, check pumllint out at the tag you
want and run `python tools/vendor_subject.py <checkout>`, which rewrites this file;
`tests/test_vendor_subject.py` holds every file to its digest.
"""
