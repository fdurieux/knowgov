# An instance's own register: one register per organisation, shared by every subject of it.
# Point KG_INSTANCE at a folder on this machine that holds the organisation's register checkout
# under register/ (the ieam-register layout: the taxonomy directories, relationships/, metamodel/,
# glossary/, mapping/, decisions/, exceptions/, exports/, tools/) and start the stack with this
# file added last:
#
#   KG_INSTANCE=/path/to/instance docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.instance.yml up -d --build --wait
#
# (leave docker-compose.override.yml out to pull the published image instead of building). The
# folder is mounted read-only: the page never writes to a register, and nothing of the instance
# is copied into the image. The page lists the subjects under the same folder, instance/subjects/,
# and none of the public ones (task-0032.02); KG_SUBJECT=/instance/subjects/<id> picks the one it
# opens on. Each joins the register through its own register_map.toml.
# Code a model writes runs in the contained worker (task-0141.05), which sees only the public subjects
# that ship in the image, not this instance: every arms run refuses while this overlay is in use
# (task-0141.07). Do not set a model key here. KG_ALLOW_UNCONTAINED_EXECUTION=1 runs it on the host
# beside the instance, uncontained, and accepts that risk.
# The layout, the check (tools/check_instance.py) and a public example (tools/example_instance.py)
# are in instance/README.md (task-0006).
services:
  app:
    environment:
      KG_REGISTER: /instance/register
      KG_SUBJECTS: /instance/subjects
      # task-0178: the register before its last update, for the Register view's changes (unset: none shown)
      KG_REGISTER_PREVIOUS: ${KG_REGISTER_PREVIOUS:-}
    volumes:
      - ${KG_INSTANCE:?set KG_INSTANCE to the instance folder on this machine}:/instance:ro
