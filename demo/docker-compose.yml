# The governed-repository demo: a Neo4j 5.26 community server and the app
# that replays the seven scenarios, re-runs them against the server, and
# serves the report view on port 8080. This file references the published
# image; docker-compose.override.yml (picked up automatically by
# `docker compose up` in this directory) builds it locally instead.
#
#   docker compose up                                   # local build (override applied)
#   docker compose -f docker-compose.yml pull && \
#   docker compose -f docker-compose.yml up -d          # the registry image, no build
#
# Variables, read from the shell or a .env file beside this compose file:
#   KG_BIND            the host address the three ports are published on (default 127.0.0.1, this machine
#                      only; 0.0.0.0 for every interface, or one of the host's addresses; [::] for IPv6).
#                      A wider bind refuses to start while KG_NEO4J_PASSWORD is the default (task-0090,
#                      neo4j/bind-guard.sh); the page has no login, so widen it only behind a firewall
#   KG_NEO4J_PASSWORD  the store's password (default kgpoc2026, the harness default, refused on a wider KG_BIND)
#   OPENAI_API_KEY     enables the arms mode; passed through to the app only, never baked in
#   KG_MODEL_BASE_URL  the model endpoint (default api.openai.com): Google's compatible endpoint, or a
#                      private model behind vLLM, Ollama, LiteLLM or a gateway
#   KG_MODEL_API_KEY_VAR  the name of the variable holding the key (default OPENAI_API_KEY); the compose
#                      file passes OPENAI_API_KEY and KG_MODEL_API_KEY through, so name one of those
#                      or add your own variable to the app service
#   KG_BROWSER_URL     where the viewer's browser reaches Neo4j Browser (default http://localhost:7474;
#                      on a server, http://<its address>:7474)
#   KG_DEMO_HOST       the host the viewer reaches this page by (default localhost): Neo4j Browser fetches
#                      the impact panel's guides from it, and allows only the hosts listed here
#   KG_STORE           the store adapter: neo4j (default) or rdflib, in memory (harness/store.py)
#   KG_SUBJECT         the subject the page opens on (default /repo/subjects/cargo_quote; see subjects/README.md)
#   KG_SUBJECTS        the subjects the header's drop-down lists: a folder of subjects or several roots, comma-separated
#                      (default /repo/subjects, both public subjects); a request picks one with ?subject=<id> (task-0032.02)
#   KG_REGISTER        the register root the page reads (default /repo/demo/register, the public register vendored at a
#                      tag); one register per organisation, shared by every subject of it; an instance mounts its own
#                      checkout with docker-compose.instance.yml
#   KG_MODELS          the models table the page's Arms call drop-down lists (default /repo/demo/models.toml):
#                      provider, base URL, model, efforts and the NAME of the key variable per row, never a key
#                      (task-0029); a row's key variable must be passed through to the app service below
#   KG_ARMS_MODEL      optional; with KG_MODEL_BASE_URL and KG_MODEL_API_KEY_VAR, an extra row in the drop-down,
#                      "this instance's settings" (a deviation from the record, marked on every run)
#   KG_ARMS_EFFORT     optional; the reasoning effort sent with every arm call (the API's literals: low,
#                      medium, high, …); empty sends none, the API's default. The page's run sets it per
#                      run; an effort other than the record's is a deviation too (task-0028)
#   KG_PORT_APP, KG_PORT_BROWSER, KG_PORT_BOLT
#                      the three published ports (defaults 8080, 7474, 7687). A second stack for another
#                      subject runs beside this one under its own project name with other ports (task-0031):
#                        KG_SUBJECT=/repo/subjects/jef_data_load KG_PORT_APP=8081 KG_PORT_BROWSER=7475 KG_PORT_BOLT=7688 \
#                        KG_BROWSER_URL=http://localhost:7475 docker compose -p knowgov-jef up -d --build --wait
#                      Each stack is the whole pair, app and its own Neo4j: two apps must not share one store,
#                      since a load would race the other's.
name: knowgov

services:
  neo4j:
    image: neo4j:5.26-community@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177   # tag and index digest (task-0092)
    # the guard refuses a wider KG_BIND with the default password, then runs the image's own entrypoint
    entrypoint: ["/bin/sh", "/knowgov/bind-guard.sh", "tini", "-g", "--", "/startup/docker-entrypoint.sh"]
    command: ["neo4j"]
    environment:
      KG_BIND: ${KG_BIND:-127.0.0.1}
      NEO4J_AUTH: neo4j/${KG_NEO4J_PASSWORD:-kgpoc2026}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      # the Browser's remote content allowlist: the page's host, so the impact panel's guides load (task-0025)
      NEO4J_browser_remote__content__hostname__whitelist: guides.neo4j.com,localhost,${KG_DEMO_HOST:-localhost}
    ports:
      - "${KG_BIND:-127.0.0.1}:${KG_PORT_BROWSER:-7474}:7474"   # Neo4j Browser, a live console with no authentication beyond the store's
      - "${KG_BIND:-127.0.0.1}:${KG_PORT_BOLT:-7687}:7687"      # bolt, for Browser and the harness
    volumes:
      - neo4j-data:/data
      - ./neo4j/bind-guard.sh:/knowgov/bind-guard.sh:ro
    healthcheck:
      # $$ keeps the shell expansion away from compose's own interpolation
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' > /dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 20s

  app:
    image: ghcr.io/fdurieux/knowgov:v0.2.0@sha256:45158832c7ad57b42dc7f4bdfd0d9f836ca6b5303767d1e972de27834fcea8d2   # the release (decision-0003) and its digest; :latest is the last main (task-0092)
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      KG_NEO4J_URI: bolt://neo4j:7687
      KG_NEO4J_PASSWORD: ${KG_NEO4J_PASSWORD:-kgpoc2026}
      KG_BROWSER_URL: ${KG_BROWSER_URL:-http://localhost:7474}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KG_MODEL_API_KEY: ${KG_MODEL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}   # the Gemini row's key (demo/models.toml); passed through, never baked in
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}   # the Claude row's key: the gateway's own, which you choose (task-0035)
      KG_MODEL_BASE_URL: ${KG_MODEL_BASE_URL:-}
      KG_MODEL_API_KEY_VAR: ${KG_MODEL_API_KEY_VAR:-OPENAI_API_KEY}
      KG_STORE: ${KG_STORE:-neo4j}
      KG_SUBJECT: ${KG_SUBJECT:-/repo/subjects/cargo_quote}
      KG_SUBJECTS: ${KG_SUBJECTS:-/repo/subjects}
      KG_REGISTER: ${KG_REGISTER:-/repo/demo/register}
      KG_MODELS: ${KG_MODELS:-/repo/demo/models.toml}
      KG_ARMS_MODEL: ${KG_ARMS_MODEL:-}   # optional: with the two KG_MODEL_* variables, the drop-down's "this instance's settings" row
      KG_ARMS_EFFORT: ${KG_ARMS_EFFORT:-}  # optional: the effort a harness run outside the page sends; the page sets its own per run
    ports:
      - "${KG_BIND:-127.0.0.1}:${KG_PORT_APP:-8080}:8080"
    volumes:
      - demo-runs:/repo/runs

  # The gateway in front of Anthropic for the Claude row (task-0035, doc-0006). Started only with the
  # profile: `docker compose --profile claude up -d --build --wait`; without it, nothing here runs.
  litellm:
    profiles: ["claude"]
    image: ghcr.io/berriai/litellm:v1.108.0@sha256:c560d317136880ea92d62334d4367ab10955b1af189dd3ea24f6551290b1d6c1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      KG_ANTHROPIC_KEY: ${KG_ANTHROPIC_KEY:-}       # your Anthropic key, read by name in litellm/config.yaml
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}   # the key the app presents to the gateway
      LITELLM_LOCAL_MODEL_COST_MAP: "True"          # no fetch of LiteLLM's price list at start; the page counts tokens
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro

volumes:
  neo4j-data:
  demo-runs:
