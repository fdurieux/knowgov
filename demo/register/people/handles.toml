# Issued handles (decisions 0009 and 0021). A handle is one person in one role: one unit and a set
# of roles, issued for one assignment from a counter, never chosen, never reassigned, never reused,
# never a name, a unit or a staff number. Who holds it is recorded and never anonymised: in the
# organisation's private register as `person`, its directory identifier (never free text, never an
# e-mail address typed by hand), or in its directory; never in a public repository. Fields: handle,
# unit (an organisation node), roles, issued, person (optional), and withdrawn once the role passes
# to someone else or the handle is retired; the holder stays recorded after withdrawal. This test
# case's handles are synthetic roles and carry no `person`.

[[handle]]
handle = "employee-1"
unit = "ORG-0002"
roles = ["gives"]
issued = 2026-11-02

[[handle]]
handle = "employee-2"
unit = "ORG-0002"
roles = ["gives", "approves"]
issued = 2026-11-02

[[handle]]
handle = "employee-3"
unit = "ORG-0001"
roles = ["gives", "approves", "closes"]
issued = 2026-11-02

[[handle]]
handle = "employee-4"
unit = "ORG-0004"
roles = ["gives", "approves", "closes"]
issued = 2026-11-03
