name: release

# A release (decision-0003): publishing a GitHub Release creates its tag v*, and the tag publishes
# the image ghcr.io/fdurieux/knowgov:<tag>. The tag must match VERSION and the top section of
# CHANGELOG.md, checked before anything is pushed. The stack itself was proven on main by demo.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is the version VERSION and CHANGELOG.md name
        run: |
          v="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v${v}" || { echo "tag ${GITHUB_REF_NAME} is not v${v} (VERSION)"; exit 1; }
          grep -m1 '^## ' CHANGELOG.md | grep -q "^## ${v} " || { echo "CHANGELOG.md's top section is not ${v}"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/Dockerfile
          push: true
          tags: ghcr.io/fdurieux/knowgov:${{ github.ref_name }}
          # task-0227: the page names the release it is (harness/build_identity.py)
          build-args: |
            KG_BUILD_COMMIT=${{ github.sha }}
            KG_BUILD_DESCRIBE=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/fdurieux/knowgov
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=knowgov, the governed-repository demo
