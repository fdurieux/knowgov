name: demo

# The governed-repository demo (demo/): on a pull request that
# touches the demo or the harness, build the image, start the stack, load one
# scenario deterministically through the app, check its numbers against the
# record, and tear down. On a push to main, also publish the image to
# ghcr.io/fdurieux/knowgov:<short-sha> and :latest, which the
# compose file references so another machine can pull instead of building.

on:
  pull_request:
    paths:
      - "demo/**"
      - "harness/**"
      - "subjects/**"
      - ".github/workflows/demo.yml"
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "harness/**"
      - "subjects/**"
      - ".github/workflows/demo.yml"

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: The report endpoint answers and sees the store
        run: |
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/api/scenarios > scenarios.json
          python3 - <<'PY'
          import json
          j = json.load(open("scenarios.json"))
          assert [s["id"] for s in j["scenarios"]] == ["S1", "S2", "S3", "S4", "S5", "S6", "S7"], j["scenarios"]
          assert j["store"]["reachable"], j["store"]
          assert j["deterministic_enabled"] and not j["arms_enabled"], j
          # task-0029: the models table's rows, the record's first; each names its key variable and whether
          # it is set, and carries no key: no field beyond the public ones, no value that looks like one
          rows = j["model_rows"]
          assert rows[0]["id"] == "record" and len(rows) > 1, rows
          public = {"id", "label", "provider", "host", "model", "efforts", "key_var", "arms", "key_set", "serves", "available", "why"}
          assert all(set(r) == public and not r["key_set"] and r["why"].startswith("set ") for r in rows[1:]), rows
          assert "sk-" not in json.dumps(rows), "a key value reached the page"
          print("model rows:", [r["id"] for r in rows])
          # task-0032.02: one stack lists both public subjects (the fixture skipped), and each route answers within the one it names
          import urllib.request, urllib.error
          subs = json.load(urllib.request.urlopen("http://localhost:8080/api/subjects"))
          assert [s["id"] for s in subs["subjects"]] == ["cargo_quote", "jef_data_load"] and subs["current"] == "cargo_quote", subs
          jf = json.load(urllib.request.urlopen("http://localhost:8080/api/scenarios?subject=jef_data_load"))
          assert [s["id"] for s in jf["scenarios"]] == ["C", "D1", "D2", "D3", "D4", "D5"] and jf["record_model"] == "", [s["id"] for s in jf["scenarios"]]
          for path in ("/api/scenarios?subject=nope", "/?subject=nope"):
              try:
                  urllib.request.urlopen("http://localhost:8080" + path); raise SystemExit(path + " answered")
              except urllib.error.HTTPError as e:
                  assert e.code == 404, (path, e.code)
          print("subjects:", [s["id"] for s in subs["subjects"]], "J-F scenarios:", [s["id"] for s in jf["scenarios"]])
          print("menu:", len(j["scenarios"]), "scenarios; store", j["store"]["uri"], "reachable")
          PY
          curl -fsS "localhost:8080/api/results/S6" | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["gate"]["verdict"]=="PROCEED" and len(v["stage2"]["invalidated"])==4 and v["cascade"]["G"].startswith("<svg"); print("replay S6 ok:", v["source"])'
          curl -fsS "localhost:8080/api/register" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["summary"]["nodes"]==56 and r["summary"]["links"]==65 and r["coverage"]["C1"]["excepted"]==1 and r["source"]["digest_ok"] and r["pinned"], r["summary"]; print("register:", r["summary"], "at", r["run_date"])'
          curl -fsS "localhost:8080/api/register/impact/APP-0002" | python3 -c 'import json,sys; w=json.load(sys.stdin); assert "PRD-0002" in w["reached"]["products"] and "JRN-0002" in w["reached"]["journeys"], w["reached"]; assert "{reg_id:'"'"'APP-0002'"'"'}" in w["cypher"]["rows"] and "RETURN a, p" in w["cypher"]["paths"] and w["panel"]["sections"][-1]["code"], w["cypher"]; print("impact APP-0002:", len(w["edges"]), "edges, with its Cypher")'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/register/impact/APP-9999)" = "404"
          curl -fsS "localhost:8080/api/register/footprint/S2" | python3 -c 'import json,sys; f=json.load(sys.stdin); assert f["uncited"]==0 and "QuoteAPI|on_screening_outage" in f["keys_below"] and f["box"]["colour"]=="warn", f["box"]; print("footprint S2:", f["box"]["lines"])'
          curl -fsS "localhost:8080/api/register/ref/req/REQ-06?scenario=S2" | python3 -c 'import json,sys; r=json.load(sys.stdin); h=[s["heading"] for s in r["panel"]["sections"]]; assert "Links citing it: 1" in h and "Rule hits in S2: 2" in h, h; print("ref REQ-06:", h)'
          curl -fsS "localhost:8080/api/register/ref/link/REL-08002" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["panel"]["title"].startswith("REL-08002"), r["panel"]["title"]; print("ref link:", r["panel"]["title"])'
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/api/register/ref/link/REL-99999")" = "404"

      - name: Load one scenario deterministically through the app
        run: |
          curl -fsS -X POST localhost:8080/api/run -H 'Content-Type: application/json' -d '{"scenario":"S1","mode":"deterministic"}' > run.json
          python3 -c 'import json; print(json.load(open("run.json"))["cmd"])'
          for i in $(seq 1 90); do
            status=$(curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" != "running" ] && break
            sleep 2
          done
          curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["log_text"]); assert r["status"]=="done", r["status"]; open("run_id","w").write(r["subject"] + "/" + r["id"])'

      - name: Project the register into the store beside the run, and read the census
        run: |
          curl -fsS -X POST localhost:8080/api/register/project -H 'Content-Type: application/json' -d '{}' | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["nodes"]==56 and c["links"]==65 and c["tag"]=="v0.2.2" and c["relationships"]==c["counts"]["relationships"] and c["relationships"]>=150, c; print("projection:", c["by_label"], c["relationships"], "relationships at", c["tag"])'
          curl -fsS localhost:8080/api/scenarios | python3 -c 'import json,sys; j=json.load(sys.stdin); s=j["store"]; assert s["register"] and s["register"]["tag"]=="v0.2.2" and s["loaded"]=="S1", s; print("store:", s["loaded"], "and the register at", s["register"]["tag"])'

      - name: Its numbers match the record
        run: |
          docker compose exec -T app python demo/tools/compare_deterministic.py "runs/$(cat run_id)"

      - name: Every saved query the page lists runs in the store
        run: |
          docker compose exec -T app python demo/tools/check_saved_queries.py | tee queries.txt
          # register-impact is the walk impact.py makes (task-0023): its rows are the panel's edges for the same start
          python3 - <<'PY'
          import json, re, urllib.request
          listed = {q["id"]: q["text"] for q in json.load(urllib.request.urlopen("http://localhost:8080/api/cypher"))}
          start = re.search(r"reg_id:'([^']+)'", listed["register-impact"]).group(1)
          edges = len(json.load(urllib.request.urlopen(f"http://localhost:8080/api/register/impact/{start}"))["edges"])
          rows = int(re.search(r"^ok\s+register-impact\s+(\d+) rows", open("queries.txt").read(), re.M).group(1))
          assert rows == edges > 0, (rows, edges)
          print(f"register-impact from {start}: {rows} rows, the walk's {edges} edges")
          PY

      - name: The impact panel's Browser links carry the walk, for every node of the register
        run: docker compose exec -T app python demo/tools/check_impact_cypher.py

      - name: An empty subject loads and the gate reports every required key absent
        run: |
          docker compose exec -T -e KG_SUBJECT=/repo/subjects/minimal app python harness/run.py --deterministic --out runs/minimal
          docker compose exec -T app python3 -c 'import json; d=json.load(open("runs/minimal/S0/deterministic.json")); g=d["D6_gate"]; ks=d["gate_keys"]; assert g["verdict"]=="BLOCKED", g; assert ks and all(v["level"]=="absent" for v in ks.values()), ks; print("minimal subject:", g["verdict"], len(ks), "keys absent")'

      - name: The example instance mounted read-only (task-0006) replays and runs deterministically, and not one byte of it changes
        run: |
          # outside runs/, which the app container created as root
          export KG_INSTANCE="${RUNNER_TEMP:-/tmp}/kg-instance"
          python3 ../tools/example_instance.py "$KG_INSTANCE" > /dev/null
          digest() { (cd "$KG_INSTANCE" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum); }
          before=$(digest)
          F="-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.instance.yml"
          docker compose $F up -d --wait --wait-timeout 240 app
          docker compose $F exec -T app sh -c 'touch /instance/probe 2>/dev/null && echo "the mount is writable" && exit 1 || echo "the mount is read-only"'
          python3 - <<'PY'
          import json, urllib.request
          subs = json.load(urllib.request.urlopen("http://localhost:8080/api/subjects"))
          assert [s["id"] for s in subs["subjects"]] == ["cargo_quote"], subs
          v = json.load(urllib.request.urlopen("http://localhost:8080/api/results/S6"))
          assert v["gate"]["verdict"] == "PROCEED" and len(v["stage2"]["invalidated"]) == 4, v["gate"]
          r = json.load(urllib.request.urlopen("http://localhost:8080/api/register"))
          assert r["summary"]["nodes"] == 56 and r["summary"]["links"] == 65, r["summary"]
          print("instance: one subject; replay S6", v["gate"]["verdict"], "; register", r["summary"])
          PY
          curl -fsS -X POST localhost:8080/api/run -H 'Content-Type: application/json' -d '{"scenario":"S1","mode":"deterministic"}' > /dev/null
          for i in $(seq 1 90); do
            status=$(curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" != "running" ] && break
            sleep 2
          done
          curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["status"]=="done", r["log_text"]; open("run_id","w").write(r["subject"] + "/" + r["id"])'
          docker compose $F exec -T -e KG_SUBJECT=/instance/subjects/cargo_quote app python demo/tools/compare_deterministic.py "runs/$(cat run_id)"
          test "$before" = "$(digest)" && echo "instance unchanged"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/Dockerfile
          push: true
          tags: |
            ghcr.io/fdurieux/knowgov:${{ steps.sha.outputs.short }}
            ghcr.io/fdurieux/knowgov:latest
          labels: |
            org.opencontainers.image.source=https://github.com/fdurieux/knowgov
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=knowgov, the governed-repository demo
