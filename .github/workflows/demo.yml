name: demo

# The governed-repository demo (demo/): on a pull request that
# touches the demo or the harness, build the image, start the stack, load one
# scenario deterministically through the app, check its numbers against the
# record, and tear down. On a push to main, also publish the image to
# ghcr.io/fdurieux/knowgov:<short-sha> and :latest, which the
# compose file references so another machine can pull instead of building.

#
# Budget (task-0084): a pull request's stack job within 12 minutes.
# J-F on a pull request (task-0084): the J-F round trip and MCP checks run the named subset
# KG_JF_SCENARIOS = C,D3 (the kit as committed, PROCEED; every layer consistently wrong,
# QUALIFIED). Its six scenarios cost about the same each, so the subset is a third of the time.
# The full set runs on every push to main, nightly (03:17 UTC) and on a manual dispatch, so no
# scenario goes unproven; a release is cut from main, which the full set has proven. The J-F
# record comparison and its oracle run in full on every event.

on:
  pull_request:
    paths:
      - "demo/**"
      - "harness/**"
      - "subjects/**"
      - "tools/**"
      - "instance/**"
      - ".github/workflows/demo.yml"
  schedule:
    - cron: "17 3 * * *"   # the full J-F set, nightly
  workflow_dispatch:       # the full J-F set, on demand
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "harness/**"
      - "subjects/**"
      - "tools/**"
      - "instance/**"
      - ".github/workflows/demo.yml"

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # task-0159: above the worst run seen (see tests/test_ci_hygiene.py), never the 12-minute budget
    env:
      # task-0084: the J-F subset on a pull request, empty (every scenario) on any other event
      KG_JF_SCENARIOS: ${{ github.event_name == 'pull_request' && 'C,D3' || '' }}
      # task-0159: the check tools in the app container append their outcomes here (tools/_outcomes.py),
      # passed by docker-compose.yml, on the runs volume, copied out at the end
      KG_OUTCOMES: /repo/runs/outcomes/stack-checks.jsonl
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: The report endpoint answers and sees the store
        run: |
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/api/scenarios > scenarios.json
          python3 - <<'PY'
          import json
          j = json.load(open("scenarios.json"))
          assert [s["id"] for s in j["scenarios"]] == ["S1", "S2", "S3", "S4", "S5", "S6", "S7"], j["scenarios"]
          assert j["store"]["reachable"], j["store"]
          assert j["deterministic_enabled"] and not j["arms_enabled"], j
          # task-0029: the models table's rows, the record's first; each names its key variable and whether
          # it is set, and carries no key: no field beyond the public ones, no value that looks like one
          rows = j["model_rows"]
          assert rows[0]["id"] == "record" and len(rows) > 1, rows
          public = {"id", "label", "provider", "host", "model", "efforts", "key_var", "arms", "key_set", "serves", "available", "why"}
          assert all(set(r) == public and not r["key_set"] and r["why"].startswith("set ") for r in rows[1:]), rows
          assert "sk-" not in json.dumps(rows), "a key value reached the page"
          print("model rows:", [r["id"] for r in rows])
          # task-0032.02: one stack lists both public subjects (the fixture skipped), and each route answers within the one it names
          import urllib.request, urllib.error
          subs = json.load(urllib.request.urlopen("http://localhost:8080/api/subjects"))
          assert [s["id"] for s in subs["subjects"]] == ["cargo_quote", "jef_data_load"] and subs["current"] == "cargo_quote", subs
          jf = json.load(urllib.request.urlopen("http://localhost:8080/api/scenarios?subject=jef_data_load"))
          assert [s["id"] for s in jf["scenarios"]] == ["C", "D1", "D2", "D3", "D4", "D5"] and jf["record_model"] == "", [s["id"] for s in jf["scenarios"]]
          for path in ("/api/scenarios?subject=nope", "/?subject=nope"):
              try:
                  urllib.request.urlopen("http://localhost:8080" + path); raise SystemExit(path + " answered")
              except urllib.error.HTTPError as e:
                  assert e.code == 404, (path, e.code)
          print("subjects:", [s["id"] for s in subs["subjects"]], "J-F scenarios:", [s["id"] for s in jf["scenarios"]])
          print("menu:", len(j["scenarios"]), "scenarios; store", j["store"]["uri"], "reachable")
          PY
          curl -fsS "localhost:8080/api/results/S6" | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["gate"]["verdict"]=="PROCEED" and len(v["stage2"]["invalidated"])==4 and v["cascade"]["G"].startswith("<svg"); print("replay S6 ok:", v["source"])'
          curl -fsS "localhost:8080/api/register" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["summary"]["nodes"]==57 and r["summary"]["links"]==65 and r["coverage"]["C1"]["excepted"]==1 and r["source"]["digest_ok"] and r["pinned"], r["summary"]; print("register:", r["summary"], "at", r["run_date"])'
          curl -fsS "localhost:8080/api/register/impact/APP-0002" | python3 -c 'import json,sys; w=json.load(sys.stdin); assert "PRD-0002" in w["reached"]["products"] and "JRN-0002" in w["reached"]["journeys"], w["reached"]; assert "{reg_id:'"'"'APP-0002'"'"'}" in w["cypher"]["rows"] and "RETURN a, p" in w["cypher"]["paths"] and w["panel"]["sections"][-1]["code"], w["cypher"]; print("impact APP-0002:", len(w["edges"]), "edges, with its Cypher")'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/register/impact/APP-9999)" = "404"
          curl -fsS "localhost:8080/api/register/footprint/S2" | python3 -c 'import json,sys; f=json.load(sys.stdin); assert f["uncited"]==0 and "QuoteAPI|on_screening_outage" in f["keys_below"] and f["box"]["colour"]=="warn", f["box"]; print("footprint S2:", f["box"]["lines"])'
          curl -fsS "localhost:8080/api/register/ref/req/REQ-06?scenario=S2" | python3 -c 'import json,sys; r=json.load(sys.stdin); h=[s["heading"] for s in r["panel"]["sections"]]; assert "Links citing it: 1" in h and "Rule hits in S2: 2" in h, h; print("ref REQ-06:", h)'
          curl -fsS "localhost:8080/api/register/ref/link/REL-08002" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["panel"]["title"].startswith("REL-08002"), r["panel"]["title"]; print("ref link:", r["panel"]["title"])'
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/api/register/ref/link/REL-99999")" = "404"

      - name: Load one scenario deterministically through the app
        run: |
          curl -fsS -X POST localhost:8080/api/run -H 'Content-Type: application/json' -d '{"scenario":"S1","mode":"deterministic"}' > run.json
          python3 -c 'import json; print(json.load(open("run.json"))["cmd"])'
          for i in $(seq 1 90); do
            status=$(curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" != "running" ] && break
            sleep 2
          done
          curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["log_text"]); assert r["status"]=="done", r["status"]; open("run_id","w").write(r["subject"] + "/" + r["id"])'
          # task-0127: the folder describes itself, and /api/runs carries it
          docker compose exec -T app cat "runs/$(cat run_id)/run.json" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert (r["status"], r["exit_code"], r["by"], r["mode"], r["scenario"]) == ("done", 0, "page", "deterministic", "S1"), r; print("run.json:", r["id"], r["status"], r["finished"])'
          curl -fsS localhost:8080/api/runs | python3 -c 'import json,sys; rid=open("run_id").read(); e=[x for x in json.load(sys.stdin)["runs"] if x["id"]==rid]; assert e and e[0]["run"]["status"]=="done", e'
          # task-0128: the MCP server's scenario_runs shows the page's run, by page, with its results' verdict
          docker compose exec -T app python - "$(cat run_id)" <<'PY'
          import json, sys
          from pathlib import Path
          sys.path[:0] = ["harness"]
          import mcp_server
          rid = sys.argv[1]
          j = mcp_server.Tools().scenario_runs({"scenario": "S1"})
          run = next(r for r in j["scenarios"][0]["runs"] if r["id"] == rid)
          det = json.loads((Path("runs") / rid / "S1" / "deterministic.json").read_text(encoding="utf-8"))
          assert (run["mode"], run["by"], run["status"], run["gate"]) == ("deterministic", "page", "done", det["D6_gate"]["verdict"]), run
          print("scenario_runs:", run["id"], run["mode"], run["by"], run["gate"])
          PY
          # and the page's /api/runs and /api/scenarios read the same folders as before runs_index: the test's
          # oracles (tests/ is not in the image) on a copy of the run folders, here on the runner
          curl -fsS localhost:8080/api/runs > api_runs.json
          curl -fsS localhost:8080/api/scenarios > api_scenarios.json
          rm -rf runs_copy && docker compose cp app:/repo/runs ./runs_copy
          (cd .. && python3 - demo/runs_copy demo/api_runs.json demo/api_scenarios.json <<'PY'
          import json, sys
          from pathlib import Path
          sys.path[:0] = ["tests", "harness", "demo/app"]
          import page_subject
          import test_scenario_runs as t
          runs, api_runs, api_sc = Path(sys.argv[1]), json.loads(Path(sys.argv[2]).read_text()), json.loads(Path(sys.argv[3]).read_text())
          with page_subject.using(t.CARGO_QUOTE):
              ps = page_subject.current()
              assert api_runs["runs"] == json.loads(json.dumps(t._old_list_runs(ps, runs))), "/api/runs moved"
              assert [s["sources"] for s in api_sc["scenarios"]] == [[x["id"] for x in t._old_sources_for(ps, s["id"], runs)] for s in api_sc["scenarios"]], "/api/scenarios moved"
          print("/api/runs and /api/scenarios as the readers before runs_index give them, on", len(api_runs["runs"]), "run folder(s)")
          PY
          )

      - name: Run S1 through knowgov-runs, the second MCP server (task-0133)
        run: |
          # decision-0008: start and poll through the page's run API over stdio; the reader then gates the new load
          docker compose exec -T app python - <<'PY'
          import json, subprocess, sys, time
          sys.path[:0] = ["harness"]
          p = subprocess.Popen([sys.executable, "harness/mcp_runs.py"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          def call(name, args, i=[0]):
              i[0] += 1
              p.stdin.write(json.dumps({"jsonrpc": "2.0", "id": i[0], "method": "tools/call", "params": {"name": name, "arguments": args}}) + "\n")
              p.stdin.flush()
              r = json.loads(p.stdout.readline())["result"]
              assert not r["isError"], (name, r["content"][0]["text"])
              return r["structuredContent"]
          opts = call("run_options", {})
          assert opts["allowed_modes"] == ["deterministic"] and opts["deterministic_enabled"], opts
          run = call("start_run", {"scenario": "S1", "mode": "deterministic"})
          for _ in range(90):
              st = call("run_status", {"run": run["id"]})
              if st["status"] != "running":
                  break
              time.sleep(2)
          p.stdin.close(); p.wait(10)
          assert st["status"] == "done" and st["by"] == "mcp", st
          import mcp_server
          tools = mcp_server.Tools()
          gate = tools.gate_verdict({"scenario": "S1", "as_of": "record"})
          assert gate["verdict"] == "PROCEED", gate["verdict"]
          rows = tools.scenario_runs({"scenario": "S1"})["scenarios"][0]["runs"]
          mine = [r for r in rows if r["id"].endswith("/" + run["id"])]
          assert mine and mine[0]["by"] == "mcp" and mine[0]["status"] == "done", rows[:2]
          print("knowgov-runs:", run["id"], st["status"], "by", st["by"], "; the reader's gate", gate["verdict"], "; scenario_runs lists it")
          PY

      - name: Project the register into the store beside the run, and read the census
        run: |
          curl -fsS -X POST localhost:8080/api/register/project -H 'Content-Type: application/json' -d '{}' | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["nodes"]==57 and c["links"]==65 and c["tag"]=="v0.2.11" and c["relationships"]==c["counts"]["relationships"] and c["relationships"]>=150, c; print("projection:", c["by_label"], c["relationships"], "relationships at", c["tag"])'
          curl -fsS localhost:8080/api/scenarios | python3 -c 'import json,sys; j=json.load(sys.stdin); s=j["store"]; assert s["register"] and s["register"]["tag"]=="v0.2.11" and s["loaded"]=="S1", s; print("store:", s["loaded"], "and the register at", s["register"]["tag"])'

      - name: Its numbers match the record
        run: |
          docker compose exec -T app python demo/tools/compare_deterministic.py "runs/$(cat run_id)"

      - name: Every saved query the page lists runs in the store
        run: |
          docker compose exec -T app python demo/tools/check_saved_queries.py | tee queries.txt
          # register-impact is the walk impact.py makes (task-0023): its rows are the panel's edges for the same start
          python3 - <<'PY'
          import json, re, urllib.request
          listed = {q["id"]: q["text"] for q in json.load(urllib.request.urlopen("http://localhost:8080/api/cypher"))}
          start = re.search(r"reg_id:'([^']+)'", listed["register-impact"]).group(1)
          edges = len(json.load(urllib.request.urlopen(f"http://localhost:8080/api/register/impact/{start}"))["edges"])
          rows = int(re.search(r"^ok\s+register-impact\s+(\d+) rows", open("queries.txt").read(), re.M).group(1))
          assert rows == edges > 0, (rows, edges)
          print(f"register-impact from {start}: {rows} rows, the walk's {edges} edges")
          # the walk's other direction and the join to the store (doc-0008 §4): each reaches something from its default start
          for qid in ("register-dependants-capability", "register-dependants-information", "register-node-store"):
              n = int(re.search(rf"^ok\s+{qid}\s+(\d+) rows", open("queries.txt").read(), re.M).group(1))
              assert n > 0, (qid, n)
              print(f"{qid}: {n} rows")
          # the other three walks (task-0112): each saved query's rows are the panel's edges for its start
          for qid, walk, children in (("register-impact-children", "dependants", 1), ("register-realisers", "realisers", 0), ("register-realisers-children", "realisers", 1)):
              start = re.search(r"reg_id:'([^']+)'", listed[qid]).group(1)
              edges = len(json.load(urllib.request.urlopen(f"http://localhost:8080/api/register/impact/{start}?walk={walk}&children={children}"))["edges"])
              n = int(re.search(rf"^ok\s+{qid}\s+(\d+) rows", open("queries.txt").read(), re.M).group(1))
              assert n == edges > 0, (qid, n, edges)
              print(f"{qid} from {start}: {n} rows, the walk's {edges} edges")
          PY

      - name: The impact panel's Browser links carry the walk and the statements view's query (task-0078), for every node of the register
        run: |
          docker compose exec -T app python demo/tools/check_impact_cypher.py | tee impact-cypher.txt
          grep -E '^every node agrees: 57 nodes, 4 walks in both forms and the statements view \(17 nodes reach statements\)$' impact-cypher.txt

      - name: An empty subject loads and the gate reports every required key absent
        run: |
          docker compose exec -T -e KG_SUBJECT=/repo/subjects/minimal app python harness/run.py --deterministic --out runs/minimal
          docker compose exec -T app python3 -c 'import json; d=json.load(open("runs/minimal/S0/deterministic.json")); g=d["D6_gate"]; ks=d["gate_keys"]; assert g["verdict"]=="BLOCKED", g; assert ks and all(v["level"]=="absent" for v in ks.values()), ks; print("minimal subject:", g["verdict"], len(ks), "keys absent")'

      - name: The gate as a command (task-0007) on the Neo4j store, with the record as baseline
        run: |
          set +e
          docker compose exec -T app python harness/gate_cli.py --as-of record --scenario S2; s2=$?
          docker compose exec -T app python harness/gate_cli.py --as-of record --scenario S2 --baseline record; s2b=$?
          docker compose exec -T app python harness/gate_cli.py --as-of record --scenario S1 -f json > gate.json; s1=$?
          docker compose exec -T app python harness/gate_cli.py --as-of record --scenario S1 --no-load; s1n=$?
          docker compose exec -T app python harness/gate_cli.py --as-of record --scenario S2 --no-load; s2n=$?
          set -e
          echo "S2 $s2, S2 against the record $s2b, S1 $s1, S1 as loaded $s1n, S2 while S1 is loaded $s2n"
          test "$s2 $s2b $s1 $s1n $s2n" = "1 0 0 0 2"
          python3 -c 'import json; r=json.load(open("gate.json")); assert r["store"]=="neo4j" and r["verdict"]=="PROCEED" and r["exit_code"]==0, r; print("gate on neo4j:", r["verdict"])'

      - name: "The contained worker (task-0141.05, decision-0012): EXEC-01 to EXEC-09 on the real worker container, and a loosened worker, network on or a key in its environment, refuses to serve"
        run: |
          docker compose exec -T app python tools/check_worker.py
          set +e
          docker run --rm --user 65534:65534 --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            knowgov:local python harness/worker.py --attest-only > ../loose-net.json; net=$?
          docker run --rm --network none --user 65534:65534 --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -e OPENAI_API_KEY=not-a-key knowgov:local python harness/worker.py --attest-only > ../loose-key.json; key=$?
          set -e
          echo "network on: exit $net; a key in its environment: exit $key"
          test "$net $key" = "3 3"
          python3 -c 'import json; n=json.load(open("../loose-net.json")); k=json.load(open("../loose-key.json")); assert not n["checks"]["loopback_only"] and not k["checks"]["no_secret_variables"] and k["secret_names"]==["OPENAI_API_KEY"], (n["checks"], k["checks"]); print("loosened workers refuse:", [c for c,v in n["checks"].items() if not v], [c for c,v in k["checks"].items() if not v])'

      - name: The MCP server (task-0056) on the Neo4j store gives gate_cli's report and the record's three-valued answers, S6 after its change names superseded_by as the record does (task-0071), and writes nothing
        run: docker compose exec -T app python tools/check_mcp_server.py --scenarios S1,S2,S6

      - name: The review step (task-0037, decision-0002) on the Neo4j store, S2' from BLOCKED to PROCEED by command, S4 settled whole
        run: docker compose exec -T app python tools/check_review_walkthrough.py runs/review

      - name: The gate brings in S6's later version (task-0049) on the Neo4j store, BLOCKED, then exits 1 on the suspect derived output after re-verification
        run: docker compose exec -T app python tools/check_gate_after_change.py runs/gate-change

      - name: A register change invalidates (task-0122) on the Neo4j store and on rdflib, the same reports; the staleness survives Neo4j to Turtle to rdflib and back
        run: |
          docker compose exec -T app sh -c 'rm -rf runs/regchange && python tools/check_register_change.py runs/regchange --stores neo4j,rdflib'
          docker compose exec -T -e KG_REGISTER=/repo/runs/regchange/register-changed app python tools/check_round_trip.py --chain neo4j,rdflib,neo4j --scenarios S1 --no-stage2 --register-previous demo/register

      - name: knowgov-trace (task-0051) on the Neo4j store, the example instance, a registered build of APP-0001 turns suspect after S6's change and check exits 1 naming it
        run: docker compose exec -T app sh -c 'rm -rf runs/trace && python tools/check_trace_walkthrough.py runs/trace'

      - name: A person's statement against the documents' (task-0038) on the Neo4j store, on S2 a contradiction raises a conflict, an agreement corroborates
        run: docker compose exec -T app python tools/check_capture_pairing.py runs/pairing

      - name: Route (c) on the Neo4j store (task-0041), a transcript read by a stub model gives inferred candidates on the empty keys only
        run: docker compose exec -T app python tools/check_transcript_route.py runs/transcript
      - name: The store survives a round trip (task-0070), Neo4j to Turtle to rdflib and back to Neo4j, every CargoQuote scenario and J-F's (the subset on a pull request), the same gate reports and three-valued answers
        run: |
          docker compose exec -T app python tools/check_round_trip.py --chain neo4j,rdflib,neo4j
          docker compose exec -T -e KG_SUBJECT=/repo/subjects/jef_data_load app python tools/check_round_trip.py --chain neo4j,rdflib,neo4j --expect-parts ${KG_JF_SCENARIOS:+--scenarios "$KG_JF_SCENARIOS"}

      - name: A register node to the statements its cited anchor names (task-0046), on Neo4j, S6 with the S1 code as derived, equal to the rdflib port
        run: |
          docker compose exec -T app sh -c 'rm -rf runs/anchor && mkdir -p runs/anchor/S1 && cp subjects/cargo_quote/vendor/kg_experiment/results/S1/run1_G.py runs/anchor/S1/ && python harness/run.py --deterministic --scenarios S6 --out runs/anchor > /dev/null'
          docker compose exec -T app python3 - <<'PY'
          import sys
          sys.path[:0] = ["harness", "demo/app"]
          from store import open_store
          import register_project
          register_project.project(open_store(access="write"))
          with open_store(access="read") as st:
              rows = st.register_node_statements("ENT-0004")
              derived = sorted({d for r in rows for d in r["derived"]})
              assert len(rows) == 13 and derived == ["derived:S1:G:run1 (suspect)"], (len(rows), derived)
              assert all(r["anchors"] == ["DT-P"] and r["document"] == "contract/decision_table.md" for r in rows), rows
              assert sorted(r["status"] for r in rows).count("invalidated") == 4, [r["status"] for r in rows]
              print(f"{st.name}: ENT-0004 -> {len(rows)} statements at DT-P (39 at document grain) -> {derived}")
          PY
          # the saved query the page lists runs on S6 and returns one row per statement
          docker compose exec -T app python demo/tools/check_saved_queries.py | tee queries-s6.txt
          grep -E '^ok +register-node-statements +[1-9][0-9]* rows' queries-s6.txt
          # the impact panel for the typed node shows the same assertions beside the walk (task-0047), through the page
          curl -fsS "localhost:8080/api/register/impact/ENT-0004" | python3 -c 'import json,sys; w=json.load(sys.stdin); s=w["statements"]; sec=[x for x in w["panel"]["sections"] if x["heading"]=="Assertions its cited anchors name"][0]; assert s["missing"] is None and len(s["rows"]) == 13 and len(sec["table"]["rows"]) == 13, s; assert w["owners"]["PROC-0001"]["unit"] == "ORG-0001", w["owners"]; print("impact ENT-0004:", len(sec["table"]["rows"]), "assertions beside the walk")'

      - name: Every subject's citations reach the statements of the documents it loads (task-0077), on Neo4j, CargoQuote's ENT-0004 on S6 and J-F's ENT-0009 on C through its directory artefacts
        run: |
          docker compose exec -T app python tools/check_node_statements.py --node ENT-0004 --expect 13 --total 392
          docker compose exec -T -e KG_SUBJECT=/repo/subjects/jef_data_load app python harness/run.py --deterministic --scenarios C --out runs/anchor-jef > /dev/null
          docker compose exec -T -e KG_SUBJECT=/repo/subjects/jef_data_load app python tools/check_node_statements.py --node ENT-0009 --expect 28 --total 707
          # register-cites joins as register_node_statements does (task-0088): J-F's cited files of contracts/, contracts/dmn/ and uml/ each reach a version,
          # compared by the file's own digest the load kept (task-0094): on C, the kit as committed, every one is the same as the register's at the tag
          docker compose exec -T -e KG_SUBJECT=/repo/subjects/jef_data_load app python demo/tools/check_saved_queries.py | tee queries-jef.txt
          grep -E '^ +register-cites: 15 documents, 1 file artefacts, 13 files of a directory artefact, 1 the subject does not load; 14 same as tag, 0 differ$' queries-jef.txt

      - name: The page names the as-of date its gate read and lists the lapsed reviews (task-0076), S1 run through the app as of 2027-09-01
        run: |
          curl -fsS -X POST localhost:8080/api/run -H 'Content-Type: application/json' -d '{"scenario":"S1","mode":"deterministic","as_of":"2027-09-01"}' | python3 -c 'import json,sys; r=json.load(sys.stdin); assert "--as-of 2027-09-01" in r["cmd"] and r["as_of"]=="2027-09-01", r; print(r["cmd"])'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/run -H 'Content-Type: application/json' -d '{"scenario":"S1","mode":"deterministic","as_of":"2027-13-01"}')" = "400"
          for i in $(seq 1 90); do
            status=$(curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" != "running" ] && break
            sleep 2
          done
          curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["status"]=="done", r["log_text"]; print(r["source"]); open("asof_source","w").write(r["source"])'
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          src = open("asof_source").read().strip()
          v = json.load(urllib.request.urlopen("http://localhost:8080/api/results/S1?source=" + urllib.parse.quote(src)))
          gate = [s for s in v["stages"] if s["id"] == "gate"][0]
          assert v["as_of"]["date"] == "2027-09-01" and not v["as_of"]["is_record"] and "as of 2027-09-01" in gate["lines"], (v["as_of"], gate["lines"])
          assert v["gate"]["verdict"] == "BLOCKED", v["gate"]
          lapsed = v["gate"]["lapsed"]
          lapse = lambda k: ("2027-02-07", 6) if k.startswith("response|") else ("2027-08-07", 12)   # register decision 0013: the response keys rest on a step
          assert len({x["key"] for x in lapsed}) == 10 and all((x["lapsed_on"], x["months"]) == lapse(x["key"]) for x in lapsed), lapsed
          sec = [x for x in v["details"]["gate"]["sections"] if x["heading"].startswith("Review currency")][0]
          cols = sec["table"]["cols"]
          assert "as of 2027-09-01" in sec["text"] and len(sec["table"]["rows"]) == len(lapsed), sec
          assert all((r[cols.index("lapsed on")], int(r[cols.index("review months")])) == lapse(r[cols.index("key")]) for r in sec["table"]["rows"]), sec["table"]
          assert any("as of 2027-09-01, not the record date" in n for n in v["narrative"]), v["narrative"]
          rec = json.load(urllib.request.urlopen("http://localhost:8080/api/results/S1?source=record"))
          assert rec["as_of"]["is_record"] and rec["gate"]["lapsed"] == [] and "as of " + rec["as_of"]["record_date"] in [s for s in rec["stages"] if s["id"] == "gate"][0]["lines"], rec["as_of"]
          print(f"S1 as of {v['as_of']['date']}: {v['gate']['verdict']}, {len(lapsed)} reviews on 10 keys lapsed, seven on 2027-08-07 at 12 months, three on 2027-02-07 at 6; the record as of {rec['as_of']['date']}, none")
          PY

      - name: S6's stage-2 gates list the lapsed reviews as stage 1's does (task-0086), S6 run through the app as of 2027-09-01
        run: |
          curl -fsS -X POST localhost:8080/api/run -H 'Content-Type: application/json' -d '{"scenario":"S6","mode":"deterministic","as_of":"2027-09-01"}' | python3 -c 'import json,sys; r=json.load(sys.stdin); assert "--as-of 2027-09-01" in r["cmd"], r; print(r["cmd"])'
          for i in $(seq 1 90); do
            status=$(curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" != "running" ] && break
            sleep 2
          done
          curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["status"]=="done", r["log_text"]; print(r["source"]); open("asof_s6_source","w").write(r["source"])'
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          src = open("asof_s6_source").read().strip()
          v = json.load(urllib.request.urlopen("http://localhost:8080/api/results/S6?source=" + urllib.parse.quote(src)))
          assert v["as_of"]["date"] == "2027-09-01" and not v["as_of"]["is_record"], v["as_of"]
          boxes = {s["id"]: s for s in v["stage2"]["stages"]}
          lapse = lambda k: ("2027-02-07", 6) if k.startswith("response|") else ("2027-08-07", 12)   # register decision 0013: the response keys rest on a step
          for panel in ("gate_before", "gate_after"):
              lapsed = v["stage2"][panel]["lapsed"]
              assert len({x["key"] for x in lapsed}) == 10 and all((x["lapsed_on"], x["months"]) == lapse(x["key"]) for x in lapsed), (panel, lapsed)
              lines = boxes[panel]["lines"]
              assert "as of 2027-09-01" in lines and any(l.endswith("lapsed, on 10 keys") for l in lines), (panel, lines)
              sec = [x for x in v["details"][panel]["sections"] if x["heading"].startswith("Review currency")][0]
              cols = sec["table"]["cols"]
              assert "as of 2027-09-01" in sec["text"] and len(sec["table"]["rows"]) == len(lapsed), (panel, sec)
              assert all((r[cols.index("lapsed on")], int(r[cols.index("review months")])) == lapse(r[cols.index("key")]) for r in sec["table"]["rows"]), (panel, sec["table"])
          assert v["stage2"]["gate_after"]["verdict"] == "BLOCKED" and boxes["gate_after"]["colour"] == "bad", (v["stage2"]["gate_after"], boxes["gate_after"]["colour"])
          rec = json.load(urllib.request.urlopen("http://localhost:8080/api/results/S6?source=record"))
          assert all(rec["stage2"][p]["lapsed"] == [] for p in ("gate_before", "gate_after")) and rec["stage2"]["gate_after"]["verdict"] == "PROCEED", rec["stage2"]["gate_after"]
          print(f"S6 as of {v['as_of']['date']}: stage 2 {v['stage2']['gate_before']['verdict']} then {v['stage2']['gate_after']['verdict']}, reviews on 10 keys lapsed in both, seven on 2027-08-07, three on 2027-02-07; the record as of {rec['as_of']['date']}, none")
          PY

      - name: The pre-load verdict read at the load (task-0064) on the Neo4j store, the example instance with its report
        run: |
          docker compose exec -T app sh -c 'rm -rf /tmp/verdict /tmp/verdict-runs && python tools/example_instance.py /tmp/verdict > /dev/null && python tools/preload_check.py /tmp/verdict -o /tmp/verdict/preload-report.json > /dev/null; cd harness && KG_SUBJECT=/tmp/verdict/subjects/cargo_quote python run.py --deterministic --scenarios S1 S6 --out /tmp/verdict-runs > /dev/null && KG_SUBJECT=/tmp/verdict/subjects/cargo_quote python gate_cli.py --as-of record --scenario S1 -f json -o /tmp/verdict-gate.json > /dev/null'
          docker compose exec -T app python3 - /tmp/verdict <<'PY'
          import json, sys
          sys.path[:0] = ["harness"]
          inst = sys.argv[1]
          d = json.load(open(f"{inst}-runs/S1/deterministic.json"))
          docs = {x["artefact"]: x for x in d["load"]["preload"]["documents"]}
          assert d["load"]["preload"]["report"] == "preload-report.json" and len(docs) == 10, d["load"]["preload"]
          assert docs["behavior/quote_flow.puml"]["state"] == "clean" and docs["behavior/quote_flow.puml"]["tool"] == "pumllint", docs
          assert docs["contract/spec.md"]["state"] == "unchecked" and docs["contract/spec.md"]["tool"] == "markdownlint", docs
          assert {x["artefact"] for x in d["D6_gate"]["preload"]} >= {"contract/spec.md"} and all(x["state"] != "clean" for x in d["D6_gate"]["preload"])
          s6 = json.load(open(f"{inst}-runs/S6/deterministic.json"))
          [v2] = s6["stage2"]["load_v2"]["preload"]["documents"]
          assert v2["artefact"] == "contract/decision_table.md" and v2["version"] == "v2" and v2["state"] == "unchecked", v2
          r = json.load(open(f"{inst}-gate.json"))
          import schema_check as s
          assert not s.validate(r, s.load("gate-report")), s.validate(r, s.load("gate-report"))
          pre = [f for f in r["findings"] if f["kind"] == "preload"]
          assert pre and all(f["severity"] == "info" for f in pre) and r["exit_code"] == 0, (pre, r["exit_code"])
          print(f"{r['store']}: {len(pre)} document(s) behind the keys unchecked or with findings; exit {r['exit_code']}")
          PY
          docker compose exec -T -e KG_SUBJECT=/tmp/verdict/subjects/cargo_quote app python3 -c 'import sys; sys.path.insert(0, "harness"); from store import open_store; v = open_store(access="read").preload_verdicts(); assert v and {x["state"] for x in v} >= {"clean", "unchecked"}, v; print("neo4j: preload_verdicts", len(v), "version(s)")'
          # task-0085: the pre-load verdicts, the gate's preload bundle and its info findings survive Neo4j→rdflib→Neo4j and rdflib→Neo4j→rdflib
          docker compose exec -T -e KG_STORE=neo4j -e KG_SUBJECT=/tmp/verdict/subjects/cargo_quote app python tools/check_round_trip.py --chain neo4j,rdflib,neo4j --scenarios S6 --expect-preload
          docker compose exec -T -e KG_STORE=rdflib -e KG_SUBJECT=/tmp/verdict/subjects/cargo_quote app python tools/check_round_trip.py --chain rdflib,neo4j,rdflib --scenarios S6 --expect-preload

      - name: "Store generations (task-0141.06, decision-0014) on the Neo4j store: SNAP-01 to SNAP-06, a half-staged load, a publication mid-read, a writer killed before and during publication, three racing writers, a recovered lease, restart and retirement; SNAP-07's round trips are the steps above"
        run: docker compose exec -T app python tools/check_snapshots.py --disposable --no-round-trip
      - name: The example instance mounted read-only (task-0006) replays and runs deterministically, and not one byte of it changes
        run: |
          # outside runs/, which the app container created as root
          export KG_INSTANCE="${RUNNER_TEMP:-/tmp}/kg-instance"
          python3 ../tools/example_instance.py "$KG_INSTANCE" > /dev/null
          digest() { (cd "$KG_INSTANCE" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum); }
          before=$(digest)
          F="-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.instance.yml"
          docker compose $F up -d --wait --wait-timeout 240 app
          docker compose $F exec -T app sh -c 'touch /instance/probe 2>/dev/null && echo "the mount is writable" && exit 1 || echo "the mount is read-only"'
          python3 - <<'PY'
          import json, urllib.request
          subs = json.load(urllib.request.urlopen("http://localhost:8080/api/subjects"))
          assert [s["id"] for s in subs["subjects"]] == ["cargo_quote"], subs
          v = json.load(urllib.request.urlopen("http://localhost:8080/api/results/S6"))
          assert v["gate"]["verdict"] == "PROCEED" and len(v["stage2"]["invalidated"]) == 4, v["gate"]
          r = json.load(urllib.request.urlopen("http://localhost:8080/api/register"))
          assert r["summary"]["nodes"] == 57 and r["summary"]["links"] == 65, r["summary"]
          print("instance: one subject; replay S6", v["gate"]["verdict"], "; register", r["summary"])
          PY
          curl -fsS -X POST localhost:8080/api/run -H 'Content-Type: application/json' -d '{"scenario":"S1","mode":"deterministic"}' > /dev/null
          for i in $(seq 1 90); do
            status=$(curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" != "running" ] && break
            sleep 2
          done
          curl -fsS localhost:8080/api/run | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["status"]=="done", r["log_text"]; open("run_id","w").write(r["subject"] + "/" + r["id"])'
          docker compose $F exec -T -e KG_SUBJECT=/instance/subjects/cargo_quote app python demo/tools/compare_deterministic.py "runs/$(cat run_id)"
          test "$before" = "$(digest)" && echo "instance unchanged"

      - name: The outcomes, machine-readable, in the job's summary (task-0159)
        if: always()
        run: |
          rm -rf outcomes && docker compose cp app:/repo/runs/outcomes ./outcomes || mkdir -p outcomes
          python3 ../tools/outcomes_summary.py outcomes >> "$GITHUB_STEP_SUMMARY"

      - name: The outcome files kept as an artifact, 14 days, outcomes JSON only (task-0159)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outcomes-stack
          path: |
            demo/outcomes/*.json
            demo/outcomes/*.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: stack
    runs-on: ubuntu-latest
    timeout-minutes: 30   # task-0159: above the worst run seen (see tests/test_ci_hygiene.py), never the 12-minute budget
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/Dockerfile
          push: true
          tags: |
            ghcr.io/fdurieux/knowgov:${{ steps.sha.outputs.short }}
            ghcr.io/fdurieux/knowgov:latest
          labels: |
            org.opencontainers.image.source=https://github.com/fdurieux/knowgov
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=knowgov, the governed-repository demo
