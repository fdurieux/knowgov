name: tests

# The unit tests: standard library plus the vendored copies, no store, no network.
# tests/run_tests.py imports every tests/test_*.py and calls each test_* function.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # task-0159: above the worst run seen (see tests/test_ci_hygiene.py), never the 12-minute budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: KG_TEST_REPORT=outcomes/tests-cargo_quote.json python tests/run_tests.py
      - name: The same suite under the second public subject
        run: KG_SUBJECT=subjects/jef_data_load KG_TEST_REPORT=outcomes/tests-jef_data_load.json python tests/run_tests.py
      - name: Statement and branch coverage of the suite, in-process, against its declared denominator (task-0159)
        run: python tools/coverage_stdlib.py --out outcomes/coverage.json
      - name: The outcomes, machine-readable, in the job's summary (task-0159)
        if: always()
        run: python tools/outcomes_summary.py outcomes >> "$GITHUB_STEP_SUMMARY"
