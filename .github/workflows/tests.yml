name: tests

# The unit tests: standard library plus the vendored copies, no store, no network.
# tests/run_tests.py imports every tests/test_*.py and calls each test_* function.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tests/run_tests.py
