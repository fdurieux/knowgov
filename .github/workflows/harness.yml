name: harness

# The deterministic half without a database: the rdflib adapter in memory, S1 to S7 against the
# vendored record through the comparator, then the J-F subject against its record and its
# oracle over the reference rebuild, then the minimal subject. Needs the Python pins the
# image installs, no Neo4j. The stack job (demo.yml) is the Neo4j adapter's proof.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rdflib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # the interpreter the demo image and the J-F kit's pins name
      - run: pip install "pumllint==0.33.0" "pyyaml==6.0.3" "rdflib==7.6.0" "pyshacl==0.40.2" "openai==3.41.0" "pandas==3.0.5" "numpy==2.4.6" "requests==2.34.2" "pyarrow==25.0.1" "pytest==9.1.1" "pytest-bdd==9.0.1"
      - name: S1 to S7 on the in-memory store match the record
        run: |
          cd harness && KG_STORE=rdflib python run.py --deterministic --out ../runs/rdflib && cd ..
          python demo/tools/compare_deterministic.py runs/rdflib
      - name: The J-F data-load subject, C and D1 to D5, matches its record (D1 skipped across store kinds)
        run: |
          cd harness && KG_STORE=rdflib KG_SUBJECT=../subjects/jef_data_load python run.py --deterministic --out ../runs/jef && cd ..
          KG_SUBJECT=subjects/jef_data_load python demo/tools/compare_deterministic.py runs/jef
      - name: The J-F subject's oracle passes the reference rebuild, every feature, 258 of 258
        run: python subjects/jef_data_load/oracle/jef_suite.py
      - name: The minimal subject loads and the gate reports every required key absent
        run: |
          cd harness && KG_STORE=rdflib KG_SUBJECT=../subjects/minimal python run.py --deterministic --out ../runs/minimal && cd ..
          python3 -c 'import json; d=json.load(open("runs/minimal/S0/deterministic.json")); g=d["D6_gate"]; ks=d["gate_keys"]; assert g["verdict"]=="BLOCKED", g; assert ks and all(v["level"]=="absent" for v in ks.values()), ks; print("minimal subject:", g["verdict"], len(ks), "keys absent")'
      - name: The example instance (task-0006), S1 to S7 from it, match the record and leave it unchanged
        run: |
          python tools/example_instance.py runs/instance
          digest() { (cd runs/instance && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum); }
          before=$(digest)
          cd harness && PYTHONDONTWRITEBYTECODE=1 KG_STORE=rdflib KG_SUBJECT=../runs/instance/subjects/cargo_quote python run.py --deterministic --out ../runs/instance-runs && cd ..
          KG_SUBJECT=runs/instance/subjects/cargo_quote python demo/tools/compare_deterministic.py runs/instance-runs
          test "$before" = "$(digest)" && echo "instance unchanged"
      - name: A stored document no mapper reads is reported absent by the check and by the load
        run: |
          mkdir -p runs/instance/artefacts/user-stories && echo "As a shipper, I want a quote." > runs/instance/artefacts/user-stories/quote.md
          python3 - <<'PY'
          from pathlib import Path
          m = Path("runs/instance/subjects/cargo_quote/subject.toml")
          story = '\n[[artefact]]\nkey = "stories/quote.md"\nfamily = "stories"\nformat = "markdown"\nlabel = "user story"\nformat_label = "markdown"\npath = "../../artefacts/user-stories/quote.md"\n'
          m.write_text(m.read_text().replace("\n# the code the oracle verified", story + "\n# the code the oracle verified", 1))
          PY
          python tools/check_instance.py runs/instance | grep '^ABSENT stories/quote.md \[user-stories\]'
          cd harness && KG_STORE=rdflib KG_SUBJECT=../runs/instance/subjects/cargo_quote python run.py --deterministic --scenarios S1 --out ../runs/instance-unmapped && cd ..
          python3 -c 'import json; d=json.load(open("runs/instance-unmapped/S1/deterministic.json")); assert d["load"]["unmapped"]==["stories/quote.md"], d["load"]; print("load: unmapped", d["load"]["unmapped"])'
      - name: A register node to the statements its cited anchor names (task-0046), through the rdflib port, S6 with the S1 code as derived
        run: |
          rm -rf runs/anchor && mkdir -p runs/anchor/S1 && cp subjects/cargo_quote/vendor/kg_experiment/results/S1/run1_G.py runs/anchor/S1/
          cd harness && KG_STORE=rdflib KG_RDFLIB_FILE=../runs/anchor/store.ttl python run.py --deterministic --scenarios S6 --out ../runs/anchor > /dev/null && cd ..
          KG_STORE=rdflib KG_RDFLIB_FILE=runs/anchor/store.ttl python3 - <<'PY'
          import sys
          sys.path[:0] = ["harness", "demo/app"]
          from store import open_store
          import register_project
          register_project.project(open_store())
          with open_store() as st:
              rows = st.register_node_statements("ENT-0004")
              derived = sorted({d for r in rows for d in r["derived"]})
              assert len(rows) == 13 and derived == ["derived:S1:G:run1 (suspect)"], (len(rows), derived)
              assert all(r["anchors"] == ["DT-P"] and r["document"] == "contract/decision_table.md" for r in rows), rows
              assert sorted(r["status"] for r in rows).count("invalidated") == 4, [r["status"] for r in rows]
              print(f"{st.name}: ENT-0004 -> {len(rows)} statements at DT-P (39 at document grain) -> {derived}")
          PY
      - name: The pre-load check (task-0045) through the CI template's script, real pumllint, the example instance clean exits 0, a planted broken PlantUML file exits 1
        run: |
          rm -rf runs/preload && python tools/example_instance.py runs/preload > /dev/null
          rc=0; sh instance/ci/preload-check.sh . runs/preload || rc=$?; test "$rc" = 0
          python tools/preload_check.py runs/preload | grep '^UNCHECKED  artefacts/api-contracts/openapi.yaml \[api-contracts\]: form unchecked: the table names Spectral'
          git -C runs/preload init -q -b main && git -C runs/preload add -A && git -C runs/preload -c user.name=ci -c user.email=ci@example.invalid commit -qm clean
          printf '@startuml\nparticipant A\nA -> B : hi\n@enduml\n' > runs/preload/artefacts/plantuml-models/broken.puml
          git -C runs/preload add -A && git -C runs/preload -c user.name=ci -c user.email=ci@example.invalid commit -qm broken
          rc=0; sh instance/ci/preload-check.sh . runs/preload HEAD~1 || rc=$?; test "$rc" = 1
          rc=0; python tools/preload_check.py runs/preload --since HEAD~1 -f json -o runs/preload.json > /dev/null || rc=$?; test "$rc" = 1
          python3 -c 'import sys,json; sys.path.insert(0,"harness"); import schema_check as s; r=json.load(open("runs/preload.json")); e=s.validate(r, s.load("preload-report")); assert not e, e; [f]=r["files"]; assert f["file"]=="artefacts/plantuml-models/broken.puml" and f["state"]=="findings" and any(x["rule"]=="SEQ001" for x in f["findings"]), f; print("broken:", f["why"])'
          rc=0; KG_FAIL_ON=blocker sh instance/ci/preload-check.sh . runs/preload HEAD~1 || rc=$?; test "$rc" = 0
      - name: The pre-load check's baseline (task-0065) on the example instance, real pumllint, the CI template's script, one known finding held exits 0, a second new one exits 1
        run: |
          rm -rf runs/preload-baseline && python tools/example_instance.py runs/preload-baseline > /dev/null
          printf '@startuml\nparticipant A\nA -> B : hi\n@enduml\n' > runs/preload-baseline/artefacts/plantuml-models/legacy.puml
          rc=0; python tools/preload_check.py runs/preload-baseline -o runs/preload-baseline/preload-baseline.json > /dev/null || rc=$?; test "$rc" = 1
          base=$(sha256sum runs/preload-baseline/preload-baseline.json)
          rc=0; KG_PRELOAD_BASELINE=preload-baseline.json sh instance/ci/preload-check.sh . runs/preload-baseline || rc=$?; test "$rc" = 0
          printf '@startuml\nparticipant A\nA -> B : hi\nA -> C : again\n@enduml\n' > runs/preload-baseline/artefacts/plantuml-models/legacy.puml
          rc=0; KG_PRELOAD_BASELINE=preload-baseline.json sh instance/ci/preload-check.sh . runs/preload-baseline > /dev/null || rc=$?; test "$rc" = 1
          rc=0; python tools/preload_check.py runs/preload-baseline --baseline runs/preload-baseline/preload-baseline.json -f json -o runs/preload-now.json > /dev/null || rc=$?; test "$rc" = 1
          rc=0; python tools/preload_check.py runs/preload-baseline --baseline runs/preload-baseline/preload-baseline.json -o runs/preload-baseline/preload-baseline.json > /dev/null 2>&1 || rc=$?; test "$rc" = 2
          test "$base" = "$(sha256sum runs/preload-baseline/preload-baseline.json)" && echo "baseline unchanged"
          python3 -c 'import sys,json; sys.path.insert(0,"harness"); import schema_check as s; r=json.load(open("runs/preload-now.json")); e=s.validate(r, s.load("preload-report")); assert not e, e; assert r["baseline"]["held"]==1 and r["baseline"]["new"]==1, r["baseline"]; print("baseline:", r["baseline"])'
      - name: The gate as a command (task-0007) exits 0, 1 or 2 under the contract, and ratchets on the record
        run: |
          cd harness
          gate() { KG_STORE=rdflib python gate_cli.py "$@" > /dev/null 2>&1; echo $?; }
          test "$(gate --scenario S1)" = 0
          test "$(gate --scenario S2)" = 1
          test "$(gate --scenario S3)" = 0
          test "$(gate --scenario S3 --fail-on major)" = 1
          test "$(gate --scenario S2 --baseline record)" = 0
          KG_STORE=rdflib python gate_cli.py --scenario S1 -f json -o ../runs/gate-s1.json > /dev/null
          test "$(gate --scenario S2 --baseline ../runs/gate-s1.json)" = 1
          test "$(gate --scenario nope)" = 2
          test "$(gate --scenario S6 --stage 2)" = 1
          test "$(gate --scenario S1 --stage 2)" = 2
          test "$(gate --scenario S6 --reverify)" = 2
          test "$(gate --scenario S6 --stage 2 --no-load)" = 2
          test "$(gate --subject ../subjects/jef_data_load --baseline record)" = 0
          test "$(gate --subject ../subjects/minimal)" = 1
          KG_STORE=rdflib python gate_cli.py --scenario S2 --baseline record
          python3 -c 'import sys,json; sys.path.insert(0,"."); import schema_check as s; r=json.load(open("../runs/gate-s1.json")); e=s.validate(r, s.load("gate-report")); assert not e, e; assert r["schema_version"]==2, r["schema_version"]; print("report valid:", r["schema_version"], r["verdict"], r["exit_code"])'
      - name: The gate brings in S6's later version (task-0049), BLOCKED on four invalidated statements, then after re-verification exits 1 on the suspect derived output (task-0048)
        run: KG_STORE=rdflib python tools/check_gate_after_change.py runs/gate-change
      - name: The capture path (task-0009), questionnaire, answers, the gate after, and nothing above proposed
        run: |
          rm -rf runs/capture && python tools/example_instance.py runs/capture > /dev/null
          export KG_SUBJECT="$PWD/runs/capture/subjects/cargo_quote" KG_REGISTER="$PWD/runs/capture/register" KG_STORE=rdflib
          cd harness
          python capture.py questionnaire --scenario S2 --out ../runs/questionnaires
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          p = Path("../runs/questionnaires/questionnaire-cargo_quote-S2-ORG-0002.toml")
          s = p.read_text().replace('from = ""', 'from = "employee-1"', 1).replace('on = ""', 'on = "2026-11-02"', 1)
          parts = s.split("[[item]]")
          for i, part in enumerate(parts[1:], 1):
              if '"response|hold_presence"' in part:
                  parts[i] = part.replace('answer = ""', 'answer = "present when status is review_hold"')
              if '"QuoteAPI|on_screening_outage"' in part:
                  parts[i] = part.replace("nobody_knows = false", "nobody_knows = true")
          Path("../runs/answered.toml").write_text("[[item]]".join(parts))
          PY
          python capture.py ingest ../runs/answered.toml
          set +e; python gate_cli.py --scenario S2 -f json > ../runs/gate-captured.json; set -e
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          r = json.load(open("../runs/gate-captured.json"))
          assert r["levels"]["response|hold_presence"] == "proposed" and r["levels"]["QuoteAPI|on_screening_outage"] == "declared_gap", r["levels"]
          # the verifications run again over the loaded store: a person's answer and a model's guess stay proposed
          from store import open_store
          import gate_cli
          from load import load_verifications, pristine_values, load_inferred
          from plant import INFERRED
          st = open_store()
          gate_cli._load(st, "S5")            # S5 loads the model-proposed assertion and, here, the captures
          for _ in range(2):
              load_verifications(st, "S5", pristine_values())
          rows = [x for x in st.assertion_rows() if x["basis"] in ("elicited", "inferred")]
          assert {x["basis"] for x in rows} == {"elicited", "inferred"} and all(x["status"] == "proposed" for x in rows), rows
          print("captured and inferred after two verification passes:", sorted((x["basis"], x["status"]) for x in rows))
          PY
      - name: The review step (task-0037, decision-0002), S2' from BLOCKED to PROCEED by command, S4 settled whole, the six-month lapse
        run: KG_STORE=rdflib python tools/check_review_walkthrough.py runs/review
      - name: The MCP server (task-0056) gives gate_cli's report for the same store, the record's three-valued answers, and writes nothing
        run: |
          KG_STORE=rdflib python tools/check_mcp_server.py
          KG_STORE=rdflib KG_SUBJECT=subjects/jef_data_load python tools/check_mcp_server.py
      - name: A person's statement against the documents' (task-0038), on S2 a contradiction raises a conflict, an agreement corroborates and raises nothing
        run: KG_STORE=rdflib python tools/check_capture_pairing.py runs/pairing
      - name: Route (c), a transcript read by a stub model (task-0041), gives inferred candidates on S2's empty keys only, listed in the questionnaire; no key, exit 2
        run: KG_STORE=rdflib python tools/check_transcript_route.py runs/transcript
