name: harness

# The deterministic half without a database: the rdflib adapter in memory, S1 to S7 against the
# vendored record through the comparator, then the J-F subject against its record and its
# oracle over the reference rebuild, then the minimal subject. Needs the Python pins the
# image installs, no Neo4j. The stack job (demo.yml) is the Neo4j adapter's proof.
#
# Budget (task-0084): a pull request's rdflib job within 12 minutes.
# J-F on a pull request (task-0084): the J-F round trip, MCP and lighthouse steps run the named subset
# KG_JF_SCENARIOS = C,D3 (the kit as committed, PROCEED; every layer consistently wrong,
# QUALIFIED). Its six scenarios cost about the same each, so the subset is a third of the time.
# The full set runs on every push to main, nightly (03:17 UTC) and on a manual dispatch, so no
# scenario goes unproven; a release is cut from main, which the full set has proven. The J-F
# record comparison and its oracle run in full on every event.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # the full J-F set, nightly
  workflow_dispatch:       # the full J-F set, on demand

permissions:
  contents: read

jobs:
  rdflib:
    runs-on: ubuntu-latest
    env:
      # task-0075: no step reads the wall clock; a command that asks today's date with no KG_TODAY
      # fails here (harness/review.py today()), so no outcome moves by the calendar
      KG_CLOCK: pinned
      # task-0084: the J-F subset on a pull request, empty (every scenario) on any other event
      KG_JF_SCENARIOS: ${{ github.event_name == 'pull_request' && 'C,D3' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # the interpreter the demo image and the J-F kit's pins name
      - run: pip install "pumllint==0.33.0" "pyyaml==6.0.3" "rdflib==7.6.0" "pyshacl==0.40.2" "openai==3.41.0" "pandas==3.0.5" "numpy==2.4.6" "requests==2.34.2" "pyarrow==25.0.1" "pytest==9.1.1" "pytest-bdd==9.0.1"
      - name: S1 to S7 on the in-memory store match the record
        run: |
          cd harness && KG_STORE=rdflib python run.py --deterministic --out ../runs/rdflib && cd ..
          python demo/tools/compare_deterministic.py runs/rdflib
      - name: The J-F data-load subject, C and D1 to D5, matches its record (D1 skipped across store kinds)
        run: |
          cd harness && KG_STORE=rdflib KG_SUBJECT=../subjects/jef_data_load python run.py --deterministic --out ../runs/jef && cd ..
          KG_SUBJECT=subjects/jef_data_load python demo/tools/compare_deterministic.py runs/jef
      - name: The J-F subject's oracle passes the reference rebuild, every feature, 258 of 258
        run: python subjects/jef_data_load/oracle/jef_suite.py
      - name: The minimal subject loads and the gate reports every required key absent
        run: |
          cd harness && KG_STORE=rdflib KG_SUBJECT=../subjects/minimal python run.py --deterministic --out ../runs/minimal && cd ..
          python3 -c 'import json; d=json.load(open("runs/minimal/S0/deterministic.json")); g=d["D6_gate"]; ks=d["gate_keys"]; assert g["verdict"]=="BLOCKED", g; assert ks and all(v["level"]=="absent" for v in ks.values()), ks; print("minimal subject:", g["verdict"], len(ks), "keys absent")'
      - name: The example instance (task-0006), S1 to S7 from it, match the record and leave it unchanged
        run: |
          python tools/example_instance.py runs/instance
          digest() { (cd runs/instance && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum); }
          before=$(digest)
          cd harness && PYTHONDONTWRITEBYTECODE=1 KG_STORE=rdflib KG_SUBJECT=../runs/instance/subjects/cargo_quote python run.py --deterministic --out ../runs/instance-runs && cd ..
          KG_SUBJECT=runs/instance/subjects/cargo_quote python demo/tools/compare_deterministic.py runs/instance-runs
          test "$before" = "$(digest)" && echo "instance unchanged"
      - name: A stored document no mapper reads is reported absent by the check and by the load
        run: |
          mkdir -p runs/instance/artefacts/user-stories && echo "As a shipper, I want a quote." > runs/instance/artefacts/user-stories/quote.md
          python3 - <<'PY'
          from pathlib import Path
          m = Path("runs/instance/subjects/cargo_quote/subject.toml")
          story = '\n[[artefact]]\nkey = "stories/quote.md"\nfamily = "stories"\nformat = "markdown"\nlabel = "user story"\nformat_label = "markdown"\npath = "../../artefacts/user-stories/quote.md"\n'
          m.write_text(m.read_text().replace("\n# the code the oracle verified", story + "\n# the code the oracle verified", 1))
          PY
          python tools/check_instance.py runs/instance | grep '^ABSENT stories/quote.md \[user-stories\]'
          cd harness && KG_STORE=rdflib KG_SUBJECT=../runs/instance/subjects/cargo_quote python run.py --deterministic --scenarios S1 --out ../runs/instance-unmapped && cd ..
          python3 -c 'import json; d=json.load(open("runs/instance-unmapped/S1/deterministic.json")); assert d["load"]["unmapped"]==["stories/quote.md"], d["load"]; print("load: unmapped", d["load"]["unmapped"])'
      - name: A register node to the statements its cited anchor names (task-0046), through the rdflib port, S6 with the S1 code as derived
        run: |
          rm -rf runs/anchor && mkdir -p runs/anchor/S1 && cp subjects/cargo_quote/vendor/kg_experiment/results/S1/run1_G.py runs/anchor/S1/
          cd harness && KG_STORE=rdflib KG_RDFLIB_FILE=../runs/anchor/store.ttl python run.py --deterministic --scenarios S6 --out ../runs/anchor > /dev/null && cd ..
          KG_STORE=rdflib KG_RDFLIB_FILE=runs/anchor/store.ttl python3 - <<'PY'
          import sys
          sys.path[:0] = ["harness", "demo/app"]
          from store import open_store
          import register_project
          register_project.project(open_store())
          with open_store() as st:
              rows = st.register_node_statements("ENT-0004")
              derived = sorted({d for r in rows for d in r["derived"]})
              assert len(rows) == 13 and derived == ["derived:S1:G:run1 (suspect)"], (len(rows), derived)
              assert all(r["anchors"] == ["DT-P"] and r["document"] == "contract/decision_table.md" for r in rows), rows
              assert sorted(r["status"] for r in rows).count("invalidated") == 4, [r["status"] for r in rows]
              print(f"{st.name}: ENT-0004 -> {len(rows)} statements at DT-P (39 at document grain) -> {derived}")
          # the impact panel for the typed node shows them beside the walk, with each reached node's owning unit (task-0047)
          import server
          w = server.impact_view("ENT-0004")
          sec = [x for x in w["panel"]["sections"] if x["heading"] == "Assertions its cited anchors name"][0]
          assert w["statements"]["rows"] == rows and len(sec["table"]["rows"]) == 13, w["statements"]
          assert w["cypher"] is None and all(w["owners"][x]["unit"] for x in w["reached"]["all"]), w["owners"]
          print(f"impact panel ENT-0004: {len(sec['table']['rows'])} assertions beside the walk")
          PY
      - name: Every subject's citations reach the statements of the documents it loads (task-0077), through the rdflib port, CargoQuote's ENT-0004 on S6 and J-F's ENT-0009 on C through its directory artefacts
        run: |
          KG_STORE=rdflib KG_RDFLIB_FILE=runs/anchor/store.ttl python tools/check_node_statements.py --node ENT-0004 --expect 13 --total 392
          rm -rf runs/anchor-jef && mkdir -p runs/anchor-jef
          cd harness && KG_STORE=rdflib KG_SUBJECT=../subjects/jef_data_load KG_RDFLIB_FILE=../runs/anchor-jef/store.ttl python run.py --deterministic --scenarios C --out ../runs/anchor-jef > /dev/null && cd ..
          KG_STORE=rdflib KG_SUBJECT=subjects/jef_data_load KG_RDFLIB_FILE=runs/anchor-jef/store.ttl python tools/check_node_statements.py --node ENT-0009 --expect 28 --total 707
      - name: The pre-load check (task-0045) through the CI template's script, real pumllint, the example instance clean exits 0, a planted broken PlantUML file exits 1
        run: |
          rm -rf runs/preload && python tools/example_instance.py runs/preload > /dev/null
          rc=0; sh instance/ci/preload-check.sh . runs/preload || rc=$?; test "$rc" = 0
          python tools/preload_check.py runs/preload | grep '^UNCHECKED  artefacts/api-contracts/openapi.yaml \[api-contracts\]: form unchecked: Spectral is not installed here'
          git -C runs/preload init -q -b main && git -C runs/preload add -A && git -C runs/preload -c user.name=ci -c user.email=ci@example.invalid commit -qm clean
          printf '@startuml\nparticipant A\nA -> B : hi\n@enduml\n' > runs/preload/artefacts/plantuml-models/broken.puml
          git -C runs/preload add -A && git -C runs/preload -c user.name=ci -c user.email=ci@example.invalid commit -qm broken
          rc=0; sh instance/ci/preload-check.sh . runs/preload HEAD~1 || rc=$?; test "$rc" = 1
          rc=0; python tools/preload_check.py runs/preload --since HEAD~1 -f json -o runs/preload.json > /dev/null || rc=$?; test "$rc" = 1
          python3 -c 'import sys,json; sys.path.insert(0,"harness"); import schema_check as s; r=json.load(open("runs/preload.json")); e=s.validate(r, s.load("preload-report")); assert not e, e; [f]=r["files"]; assert f["file"]=="artefacts/plantuml-models/broken.puml" and f["state"]=="findings" and any(x["rule"]=="SEQ001" for x in f["findings"]), f; print("broken:", f["why"])'
          rc=0; KG_FAIL_ON=blocker sh instance/ci/preload-check.sh . runs/preload HEAD~1 || rc=$?; test "$rc" = 0
      - name: The pre-load check's baseline (task-0065) on the example instance, real pumllint, the CI template's script, one known finding held exits 0, a second new one exits 1
        run: |
          rm -rf runs/preload-baseline && python tools/example_instance.py runs/preload-baseline > /dev/null
          printf '@startuml\nparticipant A\nA -> B : hi\n@enduml\n' > runs/preload-baseline/artefacts/plantuml-models/legacy.puml
          rc=0; python tools/preload_check.py runs/preload-baseline -o runs/preload-baseline/preload-baseline.json > /dev/null || rc=$?; test "$rc" = 1
          base=$(sha256sum runs/preload-baseline/preload-baseline.json)
          rc=0; KG_PRELOAD_BASELINE=preload-baseline.json sh instance/ci/preload-check.sh . runs/preload-baseline || rc=$?; test "$rc" = 0
          printf '@startuml\nparticipant A\nA -> B : hi\nA -> C : again\n@enduml\n' > runs/preload-baseline/artefacts/plantuml-models/legacy.puml
          rc=0; KG_PRELOAD_BASELINE=preload-baseline.json sh instance/ci/preload-check.sh . runs/preload-baseline > /dev/null || rc=$?; test "$rc" = 1
          rc=0; python tools/preload_check.py runs/preload-baseline --baseline runs/preload-baseline/preload-baseline.json -f json -o runs/preload-now.json > /dev/null || rc=$?; test "$rc" = 1
          rc=0; python tools/preload_check.py runs/preload-baseline --baseline runs/preload-baseline/preload-baseline.json -o runs/preload-baseline/preload-baseline.json > /dev/null 2>&1 || rc=$?; test "$rc" = 2
          test "$base" = "$(sha256sum runs/preload-baseline/preload-baseline.json)" && echo "baseline unchanged"
          python3 -c 'import sys,json; sys.path.insert(0,"harness"); import schema_check as s; r=json.load(open("runs/preload-now.json")); e=s.validate(r, s.load("preload-report")); assert not e, e; assert r["baseline"]["held"]==1 and r["baseline"]["new"]==1, r["baseline"]; print("baseline:", r["baseline"])'
      - name: The pre-load check runs Spectral on api-contracts (task-0066), pinned, through the CI template's script, a clean contract exits 0, a planted broken one exits 1
        run: |
          npm install -g "@stoplight/spectral-cli@6.17.0" > /dev/null
          rm -rf runs/preload-api && python tools/example_instance.py runs/preload-api > /dev/null
          rc=0; sh instance/ci/preload-check.sh . runs/preload-api > runs/preload-api.txt || rc=$?; test "$rc" = 0
          grep '^CLEAN      artefacts/api-contracts/openapi.yaml \[api-contracts\] Spectral' runs/preload-api.txt
          grep '^linter Spectral 6.17.0 on api-contracts' runs/preload-api.txt
          git -C runs/preload-api init -q -b main && git -C runs/preload-api add -A && git -C runs/preload-api -c user.name=ci -c user.email=ci@example.invalid commit -qm clean
          printf 'openapi: 3.0.3\ninfo:\n  title: Broken\n  version: "1"\npaths:\n  /x:\n    get:\n      responses:\n        "200":\n          description: ok\n          content:\n            application/json:\n              schema:\n                $ref: "#/components/schemas/Missing"\n' > runs/preload-api/artefacts/api-contracts/broken.yaml
          git -C runs/preload-api add -A && git -C runs/preload-api -c user.name=ci -c user.email=ci@example.invalid commit -qm broken
          rc=0; sh instance/ci/preload-check.sh . runs/preload-api HEAD~1 || rc=$?; test "$rc" = 1
          rc=0; python tools/preload_check.py runs/preload-api --since HEAD~1 -f json -o runs/preload-api.json > /dev/null || rc=$?; test "$rc" = 1
          python3 -c 'import sys,json; sys.path.insert(0,"harness"); import schema_check as s; r=json.load(open("runs/preload-api.json")); e=s.validate(r, s.load("preload-report")); assert not e, e; [f]=r["files"]; assert f["tool"]=="Spectral" and f["state"]=="findings" and any(x["rule"]=="invalid-ref" and x["severity"]=="major" for x in f["findings"]), f; print("broken contract:", f["why"])'
      - name: The pre-load verdict read at the load (task-0064), rdflib, the example instance with its report; none without one, as the instance step above shows
        run: |
          rm -rf runs/verdict runs/verdict-runs && python tools/example_instance.py runs/verdict > /dev/null
          python tools/preload_check.py runs/verdict -o runs/verdict/preload-report.json > /dev/null
          cd harness && KG_STORE=rdflib KG_SUBJECT=../runs/verdict/subjects/cargo_quote python run.py --deterministic --scenarios S1 S6 --out ../runs/verdict-runs > /dev/null
          KG_STORE=rdflib KG_SUBJECT=../runs/verdict/subjects/cargo_quote python gate_cli.py --as-of record --scenario S1 -f json -o ../runs/verdict-gate.json > /dev/null
          rc=0; KG_STORE=rdflib KG_SUBJECT=../runs/verdict/subjects/cargo_quote python gate_cli.py --as-of record --scenario S1 --fail-on info > /dev/null || rc=$?; test "$rc" = 1
          cd ..
          python3 - runs/verdict <<'PY'
          import json, sys
          sys.path[:0] = ["harness"]
          inst = sys.argv[1]
          d = json.load(open(f"{inst}-runs/S1/deterministic.json"))
          docs = {x["artefact"]: x for x in d["load"]["preload"]["documents"]}
          assert d["load"]["preload"]["report"] == "preload-report.json" and len(docs) == 10, d["load"]["preload"]
          assert docs["behavior/quote_flow.puml"]["state"] == "clean" and docs["behavior/quote_flow.puml"]["tool"] == "pumllint", docs
          assert docs["contract/spec.md"]["state"] == "unchecked" and docs["contract/spec.md"]["tool"] == "Vale, markdownlint", docs
          assert {x["artefact"] for x in d["D6_gate"]["preload"]} >= {"contract/spec.md"} and all(x["state"] != "clean" for x in d["D6_gate"]["preload"])
          s6 = json.load(open(f"{inst}-runs/S6/deterministic.json"))
          [v2] = s6["stage2"]["load_v2"]["preload"]["documents"]
          assert v2["artefact"] == "contract/decision_table.md" and v2["version"] == "v2" and v2["state"] == "unchecked", v2
          r = json.load(open(f"{inst}-gate.json"))
          import schema_check as s
          assert not s.validate(r, s.load("gate-report")), s.validate(r, s.load("gate-report"))
          pre = [f for f in r["findings"] if f["kind"] == "preload"]
          assert pre and all(f["severity"] == "info" for f in pre) and r["exit_code"] == 0, (pre, r["exit_code"])
          print(f"{r['store']}: {len(pre)} document(s) behind the keys unchecked or with findings; exit {r['exit_code']}")
          PY
      - name: The gate as a command (task-0007) exits 0, 1 or 2 under the contract, and ratchets on the record
        run: |
          cd harness
          # read as of the record's pinned date (decision-0005), so the expectations never move by the clock
          gate() { KG_STORE=rdflib python gate_cli.py --as-of record "$@" > /dev/null 2>&1; echo $?; }
          test "$(gate --scenario S1)" = 0
          test "$(gate --scenario S2)" = 1
          test "$(gate --scenario S3)" = 0
          test "$(gate --scenario S3 --fail-on major)" = 1
          test "$(gate --scenario S2 --baseline record)" = 0
          KG_STORE=rdflib python gate_cli.py --as-of record --scenario S1 -f json -o ../runs/gate-s1.json > /dev/null
          test "$(gate --scenario S2 --baseline ../runs/gate-s1.json)" = 1
          test "$(gate --scenario nope)" = 2
          test "$(gate --scenario S6 --stage 2)" = 1
          test "$(gate --scenario S1 --stage 2)" = 2
          test "$(gate --scenario S6 --reverify)" = 2
          test "$(gate --scenario S6 --stage 2 --no-load)" = 2
          test "$(gate --subject ../subjects/jef_data_load --baseline record)" = 0
          test "$(gate --subject ../subjects/minimal)" = 1
          # decision-0005: CargoQuote's ten review-only keys, reviewed 2026-08-06, lapse on 2027-08-07; J-F rests on execution
          test "$(gate --scenario S1 --as-of 2027-08-06 --baseline record)" = 0
          test "$(gate --scenario S1 --as-of 2027-08-07)" = 1
          test "$(gate --scenario S1 --as-of 2027-08-07 --baseline record)" = 1
          test "$(gate --subject ../subjects/jef_data_load --as-of 2030-01-01 --baseline record)" = 0
          test "$(gate --scenario S1 --as-of 2027-13-01)" = 2
          KG_STORE=rdflib python gate_cli.py --as-of record --scenario S2 --baseline record
          python3 -c 'import sys,json; sys.path.insert(0,"."); import schema_check as s; r=json.load(open("../runs/gate-s1.json")); e=s.validate(r, s.load("gate-report")); assert not e, e; assert r["schema_version"]==2, r["schema_version"]; print("report valid:", r["schema_version"], r["verdict"], r["exit_code"])'
      - name: The gate brings in S6's later version (task-0049), BLOCKED on four invalidated statements, then after re-verification exits 1 on the suspect derived output (task-0048)
        run: KG_STORE=rdflib python tools/check_gate_after_change.py runs/gate-change
      - name: knowgov-trace (task-0051) on the example instance, a registered build of APP-0001 turns suspect after S6's change and check exits 1 naming it
        run: rm -rf runs/trace && KG_STORE=rdflib python tools/check_trace_walkthrough.py runs/trace
      - name: "The pipeline wrappers (task-0052): the GitHub composite action, on the example instance, S6: setup"
        run: |
          rm -rf runs/wrap && python tools/example_instance.py runs/wrap/instance > /dev/null
          g() { git -C runs/wrap/instance -c user.name=ci -c user.email=ci@example.invalid "$@"; }
          g init -q -b main && g commit -q --allow-empty -m root && g add -A && g commit -qm instance
          echo "KG_STORE=rdflib" >> "$GITHUB_ENV"; echo "KG_RDFLIB_FILE=$PWD/runs/wrap/store.ttl" >> "$GITHUB_ENV"
          echo "KG_TODAY=2026-10-30" >> "$GITHUB_ENV"   # the record's day for the action's gate (task-0075; KG_CLOCK=pinned)
      - name: "The action: preload, clean, exit 0"
        uses: ./instance/ci/github
        with: { gate: preload, instance: runs/wrap/instance, base: HEAD~1 }
      - name: "The action: gate on S6, exit 0"
        uses: ./instance/ci/github
        with: { gate: gate, instance: runs/wrap/instance, scenario: S6 }
      - name: "The action: trace-register the reference code, exit 0"
        uses: ./instance/ci/github
        with: { gate: trace-register, instance: runs/wrap/instance, files: reference_impl.py, ledger: runs/wrap/ledger.json }
      - name: "The action: gate on S6's change, exit 1"
        id: wrap_stage2
        continue-on-error: true
        uses: ./instance/ci/github
        with: { gate: gate, instance: runs/wrap/instance, scenario: S6, stage: "2", report: runs/wrap/gate-stage2.json }
      - name: "A code change in the instance's repository: an edit to the registered file"
        run: |
          f=runs/wrap/instance/subjects/cargo_quote/vendor/stack_experiment/cargo_quote/reference_impl.py && echo "# an edit in the pull request" >> "$f"
          git -C runs/wrap/instance -c user.name=ci -c user.email=ci@example.invalid commit -qam edit
      - name: "The action: trace-check after the change, exit 1 naming APP-0001"
        id: wrap_check
        continue-on-error: true
        uses: ./instance/ci/github
        with: { gate: trace-check, instance: runs/wrap/instance, ledger: runs/wrap/ledger.json, base: HEAD~1, report: runs/wrap/trace-check.json }
      - name: "The action's two failing steps failed with exit 1, by their reports; then the GitLab include's script lines, run by a shell, the same command line"
        env:
          STAGE2: ${{ steps.wrap_stage2.outcome }}
          CHECK: ${{ steps.wrap_check.outcome }}
        run: |
          test "$STAGE2" = failure && test "$CHECK" = failure
          python3 -c 'import json; g=json.load(open("runs/wrap/gate-stage2.json")); t=json.load(open("runs/wrap/trace-check.json")); assert g["exit_code"]==1 and g["verdict"]=="BLOCKED", g["verdict"]; s=[f for f in t["findings"] if f["kind"]=="suspect"]; assert t["exit_code"]==1 and t["changed"]==["reference_impl.py"] and len(s)==1 and s[0]["app"]=="APP-0001", t; print("action:", g["verdict"], "then suspect on", s[0]["app"])'
          unset KG_RDFLIB_FILE; rm -rf runs/wrap-gitlab && KG_STORE=rdflib python tools/check_ci_wrappers.py runs/wrap-gitlab
      - name: "The reports as annotations (task-0083): S6's change, from the action's two reports, as GitHub commands, code quality and SARIF"
        run: |
          a() { python harness/annotate.py "$@" --instance runs/wrap/instance --subject runs/wrap/instance/subjects/cargo_quote; }
          a runs/wrap/gate-stage2.json -t github > runs/wrap/gate-stage2.gh
          a runs/wrap/trace-check.json -t github > runs/wrap/trace-check.gh
          a runs/wrap/trace-check.json -t gitlab -o runs/wrap/trace-check.cq.json
          a runs/wrap/gate-stage2.json -t sarif -o runs/wrap/gate-stage2.sarif
          grep -c '^::error file=runs/wrap/instance/subjects/cargo_quote/subject.toml,line=1,title=knowgov gate suspect_derived derived%3AS1%3AG%3Arun1 (blocker)::' runs/wrap/gate-stage2.gh
          grep -c '^::warning file=runs/wrap/instance/subjects/cargo_quote/subject.toml,line=1,title=knowgov gate stale ' runs/wrap/gate-stage2.gh
          grep -c '^::error file=runs/wrap/instance/subjects/cargo_quote/vendor/stack_experiment/cargo_quote/reference_impl.py,line=1,title=knowgov trace suspect APP-0001 (blocker)::' runs/wrap/trace-check.gh
          python3 -c 'import json; cq=json.load(open("runs/wrap/trace-check.cq.json")); s=json.load(open("runs/wrap/gate-stage2.sarif")); r=s["runs"][0]["results"]; assert any(i["check_name"]=="knowgov-suspect" and i["severity"]=="blocker" and i["location"]["path"].endswith("cargo_quote/reference_impl.py") for i in cq), cq; assert s["version"]=="2.1.0" and {"suspect_derived","stale"} <= {x["ruleId"] for x in r}, r; print("code quality:", len(cq), "issues; SARIF:", len(r), "results")'
      - name: The capture path (task-0009), questionnaire, answers, the gate after, and nothing above proposed
        run: |
          rm -rf runs/capture && python tools/example_instance.py runs/capture > /dev/null
          export KG_SUBJECT="$PWD/runs/capture/subjects/cargo_quote" KG_REGISTER="$PWD/runs/capture/register" KG_STORE=rdflib
