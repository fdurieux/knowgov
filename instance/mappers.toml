# What each mapper reads (task-0148): one line per mapper of harness/extract.py (EXTRACTORS, plus links),
# in words an adopter can act on. harness/wizard.py writes them into the onboarding skill's reference
# part; tests/test_wizard.py holds this table to the harness's mappers. Most are the public kits'
# conventions, not general formats: a document in another convention yields nothing, which means the
# wrong mapper, never "no knowledge here".

[mapper.bpmn]
reads = "A BPMN 2.0 XML process (tasks, exclusive gateways, start and end events, sequence flows) in the CargoQuote kit's task wording; yields the flow's order and each branch's outcome."

[mapper.containers]
reads = "A C4-PlantUML container diagram: `Container(...)`, `ContainerDb(...)`, `System_Ext(...)`, `Person(...)` and `Rel(a, b, \"...\")` lines."

[mapper.contracts_markdown]
reads = "A folder of prose contracts that cite requirement ids (`Requirements: JDL-045, ...`, ranges, inline); yields `<req>|elaborated_by`."

[mapper.decision_table]
reads = "Markdown with `## DT-V`, `## DT-S`, `## DT-P` sections in the CargoQuote kit's table layout (validation rows `| Vn | `field` | rule |`, screening rows `| accept/review/refuse | ... |`)."

[mapper.dmn]
reads = "A DMN 1.3 file in the CargoQuote kit's shape: rules with ids `<x>_<row>`, numeric conditions (`<= n`, `[a..b]`, `>= n`); yields `S-<row>|min`/`max` and outputs."

[mapper.dmn_decisions]
reads = "A folder of DMN 1.3 files; one `decision_table` entity per decision with its rule count, and `<req>|decided_by` for each requirement a rule's description cites."

[mapper.gherkin]
reads = "A `.feature` file whose scenarios are titled `Scenario: Gn - ...`; yields each scenario's expected response status."

[mapper.gherkin_tagged]
reads = "A folder of `.feature` files whose scenarios carry `@<req>` tags; yields `<req>|verified_by`."

[mapper.links]
reads = "A TOML file of `[[implements]]` (`requirement`, `code_unit`) and `[[verifies]]` (`requirement`, `scenario`) rows, joined to the subject's reference code."

[mapper.openapi]
reads = "An OpenAPI YAML with `components.schemas.QuoteRequest` and `QuoteResponse`; yields each request field's `min`, `max`, `present` and the response's status values."

[mapper.plantuml_realises]
reads = "A folder of PlantUML diagrams whose footer lists `realises` requirement ids; yields one `diagram` per file and `<req>|realised_by`."

[mapper.requirements]
reads = "Markdown table rows `| REQ-nn | text |`, the id literally `REQ-` and digits; each row yields `REQ-nn|text` (authored). Other id prefixes yield nothing."

[mapper.requirements_json]
reads = "A folder (bundle) of JSON lists of `{id, kind, statement, basis}`; each item yields `<id>|statement`. Ids match `[rules] requirement_id_pattern`."

[mapper.sequence]
reads = "A PlantUML sequence diagram, read by pumllint's parser; yields participants and `alt` branches."

[mapper.spec]
reads = "Markdown with a `## Flow order` numbered list and an `## API contract` section, in the CargoQuote kit's wording; yields the flow's order and the response's status set."
