# knowgov's gates as a GitLab CI include (task-0052; instance/README.md "Running the gates in your
# pipeline"). It maps GitLab's commit and a merge request's diff base to the KG_* variables of
# instance/ci/knowgov-gate.sh. In the instance's or the code repository's .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/fdurieux/knowgov/<tag>/instance/ci/gitlab/knowgov.gitlab-ci.yml
#   knowgov-trace:
#     extends: .knowgov-gate
#     variables: { KNOWGOV_REF: "<tag>", KG_GATE: trace-check, KG_INSTANCE: instance }
#
# The job clones knowgov at KNOWGOV_REF; the instance checkout at KG_INSTANCE is the caller's
# (a submodule or a before_script clone). The store's variables (KG_STORE and its own) come from the
# project's CI/CD variables. Every gate's findings reach the merge request's code-quality
# widget through gl-code-quality-report.json (KG_ANNOTATE; harness/annotate.py; task-0083). Exit: the core command's, 0 pass, 1 a finding at or above KG_FAIL_ON,
# 2 cannot run; make the job required through the merge request's approval rules.
.knowgov-gate:
  image: python:3.12@sha256:17b9724493d916f56565c131f389faff2597f46dec6ce09516f95125bc9f519f   # tag and index digest (task-0092)
  variables:
    KNOWGOV_REF: main          # pin a tag
    KNOWGOV_PIP: "pumllint==0.35.0 rdflib==7.6.0 pyshacl==0.40.2 pyyaml==6.0.3"   # the tag's harness.yml pins your store needs
    KG_GATE: gate              # preload, gate, trace-check or trace-register
    KG_INSTANCE: instance
    KG_AS_OF: ""               # gate, trace-*: the date review currency is read on (YYYY-MM-DD, record); empty: today
    KG_PUBLISH: ""             # gate: 1 to publish the load to KG_STORE's store for a later trace job; empty: the store is left as it was
    GIT_DEPTH: "0"             # the diff against the merge request's base
    KG_ANNOTATE: "gitlab:gl-code-quality-report.json"   # empty: no code-quality report
  before_script:
    - git clone --depth 1 --branch "$KNOWGOV_REF" https://github.com/fdurieux/knowgov.git /tmp/knowgov
    - pip install $KNOWGOV_PIP
  script:
    - export KG_COMMIT="$CI_COMMIT_SHA" KG_BASE="${KG_BASE:-${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}}" KG_CODE_REPO="${KG_CODE_REPO:-$CI_PROJECT_NAME}"
    - sh /tmp/knowgov/instance/ci/knowgov-gate.sh /tmp/knowgov "$KG_INSTANCE" "$KG_GATE"
  artifacts:
    when: always               # a failing gate's findings are the ones to show
    reports:
      codequality: gl-code-quality-report.json
