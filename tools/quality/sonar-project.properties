# The advisory SonarQube scan's analysis settings (task-0250, doc-0033). Read by .github/workflows/quality.yml
# through -Dproject.settings; the server, the scanner and the profile are pinned there and in this folder.
sonar.projectKey=knowgov
sonar.projectName=knowgov
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Ours: the pipeline, the page, the tools, the instance templates and hooks, the subjects' own files.
sonar.sources=harness,demo,tools,instance,subjects,.claude/hooks
sonar.tests=tests

# Not ours, or not code (the review's sonarqube-analysis.properties): the vendored register, model and subject
# bytes, recorded outputs and probes, fixtures, the backlog and docs, re-runs and outcomes. Dockerfile.dockerignore
# is BuildKit's per-Dockerfile ignore file, which the Docker analyser would otherwise read as a Dockerfile.
sonar.exclusions=demo/register/**,demo/model/**,subjects/*/vendor/**,subjects/*/record/**,subjects/*/probes/**,\
  tools/fixtures/**,backlog/**,docs/**,runs/**,outcomes/**,**/__pycache__/**,**/*.dockerignore,**/*.md
sonar.docker.file.patterns=**/Dockerfile

# Coverage: tools/coverage_stdlib.py's per-line report, converted by tools/quality/coverage_xml.py.
sonar.coverageReportPaths=outcomes/sonar-coverage.xml
# The measurer's denominator (tools/coverage_stdlib.py COUNTED and LEFT_OUT): child-process code is not
# instrumented, so the subjects' oracles, the page's front end and the CI templates' shell are not in it.
sonar.coverage.exclusions=subjects/**,demo/app/**/*.html,demo/app/**/*.js,demo/app/**/*.css,**/*.sh,**/*.yml,**/*.toml,**/Dockerfile

# Advisory: the scan never waits on, or fails by, a quality gate.
sonar.qualitygate.wait=false
sonar.scm.disabled=false
